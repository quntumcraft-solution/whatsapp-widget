<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=240,height=320,initial-scale=1">
<title>WhatsApp</title>

<style>
html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    font-family:Arial,sans-serif;
    background:#fff;
    overflow:hidden;
}

.header{
    height:40px;
    background:#25D366;
    color:#fff;
    font-size:17px;
    font-weight:bold;
    display:flex;
    align-items:center;
    padding-left:10px;
}

.content{
    height:230px;
    padding:10px;
}

button{
    width:100%;
    height:48px;
    margin-bottom:10px;
    background:#fff;
    border:1px solid #999;
    font-size:15px;
    text-align:center;
}

button:focus{
    outline:2px solid #128C7E;
    background:#e8fff0;
}

.footer{
    height:30px;
    border-top:1px solid #aaa;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 8px;
    font-size:11px;
}
</style>
</head>

<body>

<div class="header">WhatsApp</div>

<div class="content">

<button id="open" onclick="openWhatsApp()">
Open WhatsApp
</button>

</div>

<div class="footer">
<span>SELECT</span>
<span>BACK</span>
</div>

<script>

function openWhatsApp(){
    window.location.href="https://web.whatsapp.com/";
}

document.getElementById("open").focus();

document.addEventListener("keydown",function(e){

    if(e.key==="Enter"){
        e.preventDefault();
        openWhatsApp();
    }

});

</script>

</body>
  </html>
