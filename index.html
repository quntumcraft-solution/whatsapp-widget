<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
      maximum-scale=1.0,user-scalable=no">

<title>Cloud App Store</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  background:#000;
  color:#fff;
  font-family:Arial,sans-serif;
  overflow:hidden;
}

button,input,select{
  font:inherit;
}

button{
  cursor:pointer;
}

#app{
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
  background:#000;
}

/* TOP BAR */

.topbar{
  height:48px;
  min-height:48px;
  border-bottom:1px solid #fff;
  display:flex;
  align-items:center;
  padding:0 8px;
  gap:8px;
}

.menuBtn{
  width:36px;
  height:36px;
  background:#000;
  color:#fff;
  border:1px solid #fff;
  font-size:21px;
}

.logoTitle{
  font-size:17px;
  font-weight:bold;
  flex:1;
  white-space:nowrap;
  overflow:hidden;
}

.device{
  font-size:9px;
  border:1px solid #fff;
  padding:4px;
}

/* CONTENT */

.content{
  flex:1;
  overflow-y:auto;
  overflow-x:hidden;
  padding:8px;
}

.pageTitle{
  font-size:19px;
  font-weight:bold;
  margin-bottom:8px;
}

.subTitle{
  font-size:11px;
  color:#bbb;
  margin-bottom:10px;
}

/* SEARCH */

.search{
  width:100%;
  height:38px;
  background:#000;
  border:1px solid #fff;
  color:#fff;
  padding:0 10px;
  outline:none;
  margin-bottom:9px;
}

.search::placeholder{
  color:#aaa;
}

/* CATEGORY */

.categoryBar{
  display:flex;
  gap:5px;
  overflow-x:auto;
  margin-bottom:10px;
  padding-bottom:3px;
}

.categoryBtn{
  white-space:nowrap;
  background:#000;
  color:#fff;
  border:1px solid #777;
  padding:6px 9px;
  font-size:10px;
}

.categoryBtn.active{
  background:#fff;
  color:#000;
  border-color:#fff;
}

/* APP GRID */

.appGrid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:7px;
}

.card{
  border:1px solid #555;
  padding:7px;
  background:#050505;
  min-width:0;
}

.appTop{
  display:flex;
  gap:7px;
  align-items:center;
}

.appLogo{
  width:38px;
  height:38px;
  min-width:38px;
  border:1px solid #777;
  background:#111;
  object-fit:contain;
}

.appName{
  font-size:12px;
  font-weight:bold;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.appCat{
  font-size:8px;
  color:#aaa;
  margin-top:3px;
}

.appDesc{
  font-size:9px;
  color:#bbb;
  line-height:1.25;
  margin:6px 0;
  min-height:23px;
}

.cardBtns{
  display:flex;
  gap:4px;
}

.smallBtn{
  flex:1;
  min-width:0;
  height:27px;
  background:#000;
  border:1px solid #fff;
  color:#fff;
  font-size:9px;
}

.smallBtn.primary{
  background:#fff;
  color:#000;
}

/* MENU */

.menuOverlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.82);
  z-index:50;
  display:none;
}

.menu{
  width:230px;
  max-width:80%;
  height:100%;
  background:#000;
  border-right:1px solid #fff;
  padding:10px;
}

.menuHead{
  font-size:18px;
  font-weight:bold;
  padding:8px 0 14px;
  border-bottom:1px solid #444;
  margin-bottom:8px;
}

.menuItem{
  width:100%;
  height:40px;
  margin-bottom:6px;
  text-align:left;
  padding:0 10px;
  background:#000;
  color:#fff;
  border:1px solid #555;
  font-size:12px;
}

.menuItem:hover,
.menuItem:focus{
  border-color:#fff;
}

/* SETTINGS */

.settingBox{
  border:1px solid #555;
  padding:9px;
  margin-bottom:8px;
}

.settingTitle{
  font-size:13px;
  font-weight:bold;
  margin-bottom:8px;
}

.settingRow{
  min-height:36px;
  border-bottom:1px solid #222;
  display:flex;
  align-items:center;
  gap:7px;
}

.settingRow:last-child{
  border-bottom:0;
}

.settingName{
  flex:1;
  font-size:10px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.toggle{
  width:38px;
  height:22px;
  border:1px solid #fff;
  background:#000;
  position:relative;
  flex-shrink:0;
}

.toggle::after{
  content:"";
  position:absolute;
  width:14px;
  height:14px;
  top:3px;
  left:3px;
  background:#777;
}

.toggle.on::after{
  left:19px;
  background:#fff;
}

.danger{
  border-color:#aaa;
}

/* FORM */

.formInput,
.formSelect{
  width:100%;
  height:36px;
  background:#000;
  color:#fff;
  border:1px solid #777;
  padding:0 8px;
  margin-bottom:7px;
  outline:none;
}

.formBtn{
  height:36px;
  width:100%;
  background:#fff;
  color:#000;
  border:1px solid #fff;
  font-weight:bold;
  margin-bottom:7px;
}

/* INFO */

.infoLine{
  border-bottom:1px solid #333;
  padding:9px 0;
  font-size:11px;
}

.badge{
  display:inline-block;
  border:1px solid #777;
  padding:3px 5px;
  font-size:8px;
}

/* EMPTY */

.empty{
  text-align:center;
  padding:35px 10px;
  color:#aaa;
  font-size:12px;
}

/* DESKTOP */

@media(min-width:600px){
  .appGrid{
    grid-template-columns:repeat(4,minmax(0,1fr));
  }

  .content{
    padding:14px;
  }
}

/* 240x320 / KEYPAD */

@media(max-width:320px){

  .topbar{
    height:42px;
    min-height:42px;
    padding:0 5px;
  }

  .menuBtn{
    width:31px;
    height:31px;
    font-size:17px;
  }

  .logoTitle{
    font-size:13px;
  }

  .device{
    font-size:7px;
    padding:3px;
  }

  .content{
    padding:5px;
  }

  .pageTitle{
    font-size:15px;
    margin-bottom:5px;
  }

  .subTitle{
    font-size:8px;
    margin-bottom:6px;
  }

  .search{
    height:32px;
    margin-bottom:6px;
    font-size:11px;
  }

  .categoryBtn{
    padding:5px 7px;
    font-size:8px;
  }

  .appGrid{
    gap:4px;
  }

  .card{
    padding:5px;
  }

  .appLogo{
    width:29px;
    height:29px;
    min-width:29px;
  }

  .appName{
    font-size:9px;
  }

  .appCat{
    font-size:7px;
  }

  .appDesc{
    font-size:7px;
    min-height:18px;
    margin:4px 0;
  }

  .smallBtn{
    height:23px;
    font-size:7px;
  }

  .settingBox{
    padding:6px;
    margin-bottom:5px;
  }

  .settingTitle{
    font-size:10px;
  }

  .settingRow{
    min-height:30px;
  }

  .settingName{
    font-size:8px;
  }
}
</style>
</head>
