<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
user-scalable=no">

<title>Web Hub 2</title>

<style>

*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
font-family:Arial,sans-serif;
background:#070b14;
color:#fff;
}

.app{
width:100%;
height:100%;
max-width:380px;
margin:auto;
display:flex;
flex-direction:column;
background:
radial-gradient(circle at 50% -10%,#18345d 0,#0b1220 35%,#070b14 70%);
}

/* =========================
   TOP BAR
========================= */

.top{
padding:10px 12px 6px;
}

.top-row{
display:flex;
align-items:center;
justify-content:space-between;
}

.brand{
display:flex;
align-items:center;
gap:8px;
}

.logo{
width:32px;
height:32px;
border-radius:10px;
display:flex;
align-items:center;
justify-content:center;
font-weight:900;
font-size:12px;
background:linear-gradient(135deg,#2374ff,#6d42ff);
box-shadow:0 5px 18px rgba(40,110,255,.3);
}

.title{
font-size:15px;
font-weight:800;
}

.subtitle{
font-size:8px;
color:#91a0b8;
margin-top:2px;
}

.more{
width:30px;
height:30px;
border-radius:50%;
font-size:16px;
background:#121b2b;
}

/* =========================
   SEARCH
========================= */

.search{
margin:6px 10px;
height:36px;
display:flex;
align-items:center;
padding:0 11px;
gap:7px;
background:#111a29;
border:1px solid #26364d;
border-radius:13px;
}

.search-icon{
font-size:14px;
color:#8da0bb;
}

.search input{
flex:1;
border:0;
outline:0;
background:transparent;
color:#fff;
font-size:11px;
min-width:0;
}

.search input::placeholder{
color:#708098;
}

/* =========================
   CATEGORY CHIPS
========================= */

.categories{
display:flex;
gap:6px;
overflow:hidden;
padding:3px 10px 7px;
}

.chip{
flex:none;
border:1px solid #2b3d57;
background:#111a29;
color:#aebbd0;
border-radius:20px;
padding:6px 10px;
font-size:8px;
}

.chip.active{
background:#2467d8;
border-color:#4d8fff;
color:#fff;
}

/* =========================
   CONTENT
========================= */

.content{
flex:1;
overflow:hidden;
padding:0 10px;
}

/* =========================
   SECTION HEADER
========================= */

.section-head{
display:flex;
align-items:center;
justify-content:space-between;
margin:4px 2px 7px;
}

.section-title{
font-size:11px;
font-weight:800;
}

.section-count{
font-size:8px;
color:#7f91aa;
}

/* =========================
   FEATURED CARD
========================= */

.featured{
width:100%;
height:58px;
border:1px solid #31598f;
border-radius:15px;
background:
linear-gradient(135deg,#163d78,#19264a);
display:flex;
align-items:center;
padding:8px;
margin-bottom:9px;
box-shadow:0 7px 20px rgba(0,0,0,.2);
}

.featured-icon{
width:40px;
height:40px;
border-radius:12px;
background:#25d366;
display:flex;
align-items:center;
justify-content:center;
font-size:20px;
margin-right:9px;
}

.featured-text{
flex:1;
}

.featured-title{
font-size:11px;
font-weight:bold;
}

.featured-sub{
font-size:8px;
color:#a9bad1;
margin-top:3px;
}

.launch{
padding:7px 9px;
border-radius:10px;
background:#fff;
color:#17366a;
font-size:8px;
font-weight:bold;
}

/* =========================
   APP GRID
========================= */

.grid{
display:grid;
grid-template-columns:
repeat(4,1fr);
gap:7px;
}

.app-card{
height:63px;
border:1px solid #202e42;
background:#101827;
border-radius:14px;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
gap:5px;
transition:.12s;
}

.app-card.selected{
background:#1c4e99;
border-color:#6da5ff;
box-shadow:
0 0 0 2px rgba(91,157,255,.18),
0 7px 20px rgba(0,0,0,.25);
transform:scale(1.02);
}

.app-icon{
width:29px;
height:29px;
border-radius:9px;
display:flex;
align-items:center;
justify-content:center;
font-size:12px;
font-weight:900;
background:#1d2b40;
}

.app-name{
width:100%;
padding:0 3px;
text-align:center;
font-size:7px;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
color:#d9e2ef;
}

/* =========================
   BOTTOM BAR
========================= */

.bottom{
height:36px;
border-top:1px solid #1d2a3c;
background:#0b111d;
display:flex;
align-items:center;
justify-content:space-around;
flex:none;
}

.bottom-item{
font-size:8px;
color:#73849c;
text-align:center;
}

.bottom-item.active{
color:#6da7ff;
}

.bottom-icon{
font-size:13px;
display:block;
margin-bottom:1px;
}

/* =========================
   EMPTY
========================= */

.empty{
text-align:center;
padding:25px 10px;
font-size:10px;
color:#8292a8;
}

</style>
</head>


<body>

<div class="app">


<!-- TOP -->

<div class="top">

<div class="top-row">

<div class="brand">

<div class="logo">
W2
</div>

<div>

<div class="title">
Web Hub 2
</div>

<div class="subtitle">
Your mini web app
</div>

</div>

</div>

<button class="more">
⋮
</button>

</div>

</div>


<!-- SEARCH -->

<div class="search">

<div class="search-icon">
⌕
</div>

<input
id="search"
placeholder="Search apps & websites..."
autocomplete="off">

</div>


<!-- CATEGORIES -->

<div
class="categories"
id="categories">
</div>


<!-- CONTENT -->

<div class="content">


<!-- FEATURED -->

<div
class="featured"
id="featured">

<div class="featured-icon">
◉
</div>

<div class="featured-text">

<div class="featured-title">
Quick Web Access
</div>

<div class="featured-sub">
100 websites ready to open
</div>

</div>

<div class="launch">
OPEN
</div>

</div>


<!-- SECTION -->

<div class="section-head">

<div class="section-title">
All Websites
</div>

<div
class="section-count"
id="count">
100
</div>

</div>


<!-- GRID -->

<div
class="grid"
id="grid">
</div>


</div>


<!-- BOTTOM -->

<div class="bottom">

<div class="bottom-item active">

<span class="bottom-icon">⌂</span>
Home

</div>

<div class="bottom-item">

<span class="bottom-icon">★</span>
Favorites

</div>

<div class="bottom-item">

<span class="bottom-icon">◷</span>
Recent

</div>

<div class="bottom-item">

<span class="bottom-icon">⚙</span>
Settings

</div>

</div>


</div>


<script>

/* =========================================

========================================= */

const sites = [

/* GOVERNMENT */

/* JOBS */

/* EDUCATION */

["Education","NPTEL","https://nptel.ac.in/"],

["Education","Shodhganga","https://shodhganga.inflibnet.ac.in/"],
["Education","e-PG Pathshala","https://epgp.inflibnet.ac.in/"],
["Education","Testbook","https://testbook.com/"],
["Education","Adda247","https://www.adda247.com/"],
["Education","Careers360","https://www.careers360.com/"],
["Education","Shiksha","https://www.shiksha.com/"],

/* EXAMS */

["Exams","CBSE","https://www.cbse.gov.in/"],
["Exams","Maharashtra Board","https://mahahsscboard.in/"],
["Exams","UPSC","https://upsc.gov.in/"],
["Exams","SSC","https://ssc.gov.in/"],
["Exams","IBPS","https://www.ibps.in/"],
["Exams","NTA","https://exams.nta.ac.in/"],
["Exams","JEE Main","https://jeemain.nta.nic.in/"],
["Exams","NEET","https://neet.nta.nic.in/"],
["Exams","MPSC","https://mpsc.gov.in/"],
["Exams","MahaDBT","https://mahadbt.maharashtra.gov.in/"],

/* TRAVEL */

["Travel","IRCTC","https://www.irctc.co.in/"],
["Travel","Indian Railways","https://indianrailways.gov.in/"],
["Travel","RedBus","https://www.redbus.in/"],
["Travel","MakeMyTrip","https://www.makemytrip.com/"],
["Travel","Goibibo","https://www.goibibo.com/"],
["Travel","EaseMyTrip","https://www.easemytrip.com/"],
["Travel","Yatra","https://www.yatra.com/"],
["Travel","IndiGo","https://www.goindigo.in/"],
["Travel","Air India","https://www.airindia.com/"],
["Travel","Cleartrip","https://www.cleartrip.com/"],

/* FOOD */

["Food","Swiggy","https://www.swiggy.com/"],
["Food","Zomato","https://www.zomato.com/"],
["Food","Blinkit","https://blinkit.com/"],
["Food","Zepto","https://www.zeptonow.com/"],
["Food","BigBasket","https://www.bigbasket.com/"],
["Food","JioMart","https://www.jiomart.com/"],
["Food","Domino's","https://www.dominos.co.in/"],
["Food","McDonald's","https://www.mcdonaldsindia.com/"],
["Food","EatSure","https://www.eatsure.com/"],
["Food","FreshToHome","https://www.freshtohome.com/"],

/* FINANCE */

["Finance","PhonePe","https://www.phonepe.com/"],
["Finance","Paytm","https://paytm.com/"],
["Finance","Google Pay","https://pay.google.com/"],
["Finance","Bajaj Finserv","https://www.bajajfinserv.in/"],
["Finance","Razorpay","https://razorpay.com/"],
["Finance","CRED","https://cred.club/"],
["Finance","Groww","https://groww.in/"],
["Finance","Zerodha","https://zerodha.com/"],
["Finance","Upstox","https://upstox.com/"],
["Finance","Moneycontrol","https://www.moneycontrol.com/"],

/* SHOPPING */

["Shopping","AJIO","https://www.ajio.com/"],
["Shopping","Nykaa","https://www.nykaa.com/"],
["Shopping","Tata CLiQ","https://www.tatacliq.com/"],
["Shopping","Snapdeal","https://www.snapdeal.com/"],
["Shopping","IndiaMART","https://www.indiamart.com/"],
["Shopping","OLX","https://www.olx.in/"],
["Shopping","CarDekho","https://www.cardekho.com/"],
["Shopping","BikeDekho","https://www.bikedekho.com/"],
["Shopping","Pepperfry","https://www.pepperfry.com/"],
["Shopping","FirstCry","https://www.firstcry.com/"],

/* ENTERTAINMENT */

["Entertainment","Netflix","https://www.netflix.com/"],
["Entertainment","JioHotstar","https://www.hotstar.com/"],
["Entertainment","Sony LIV","https://www.sonyliv.com/"],
["Entertainment","ZEE5","https://www.zee5.com/"],
["Entertainment","JioSaavn","https://www.jiosaavn.com/"],
["Entertainment","Gaana","https://gaana.com/"],
["Entertainment","BookMyShow","https://in.bookmyshow.com/"],
["Entertainment","MX Player","https://www.mxplayer.in/"],
["Entertainment","Aha","https://www.aha.video/"],
["Entertainment","Hungama","https://www.hungama.com/"],

/* USEFUL */

["Useful","Justdial","https://www.justdial.com/"],
["Useful","Practo","https://www.practo.com/"],
["Useful","Goodreturns","https://www.goodreturns.in/"],
["Useful","Screener","https://www.screener.in/"],
["Useful","Prokerala","https://www.prokerala.com/"],
["Useful","APKMirror","https://www.apkmirror.com/"],
["Useful","Speedtest","https://www.speedtest.net/"],
["Useful","VirusTotal","https://www.virustotal.com/"],
["Useful","Canva","https://www.canva.com/"],
["Useful","Smallpdf","https://smallpdf.com/"]

];


/* =========================================
   VARIABLES
========================================= */

const grid =
document.getElementById("grid");

const search =
document.getElementById("search");

const categories =
document.getElementById("categories");

const count =
document.getElementById("count");

let currentCategory =
"All";

let selected =
0;

let filtered =
[];


/* =========================================
   CATEGORIES
========================================= */

const categoryList = [
"All",
...new Set(
sites.map(
site => site[0]
)
)
];


function createCategories(){

categories.innerHTML="";


categoryList.forEach(
category=>{

const button =
document.createElement("button");

button.className =
"chip";

if(
category ===
currentCategory
){

button.classList.add(
"active"
);

}

button.textContent =
category;

button.onclick =
function(){

currentCategory =
category;

selected=0;

createCategories();

render();

};

categories.appendChild(
button
);

});

}


/* =========================================
   FILTER
========================================= */

function getSites(){

const text =
search.value
.toLowerCase()
.trim();


return sites.filter(
site=>{

const categoryOK =
currentCategory === "All" ||
site[0] === currentCategory;


const searchOK =
!text ||
site[1]
.toLowerCase()
.includes(text) ||
site[0]
.toLowerCase()
.includes(text);


return (
categoryOK &&
searchOK
);

});

}


/* =========================================
   ICON
========================================= */

function getIcon(name){

const icons = {

"India.gov.in":"🇮🇳",
"DigiLocker":"🔐",
"UMANG":"📱",
"MyGov":"🇮🇳",
"UIDAI":"🪪",
"Naukri":"💼",
"Indeed":"🔎",
"LinkedIn Jobs":"in",
"Internshala":"🎓",
"Apna":"A",
"NPTEL":"N",
"SWAYAM":"S",
"DIKSHA":"D",
"Testbook":"T",
"Adda247":"A",
"CBSE":"C",
"UPSC":"U",
"SSC":"S",
"IBPS":"I",
"JEE Main":"J",
"NEET":"N",
"MPSC":"M",
"IRCTC":"🚆",
"RedBus":"🚌",
"MakeMyTrip":"✈",
"Goibibo":"G",
"IndiGo":"✈",
"Swiggy":"S",
"Zomato":"Z",
"Blinkit":"B",
"Zepto":"Z",
"BigBasket":"B",
"JioMart":"J",
"PhonePe":"P",
"Paytm":"P",
"Google Pay":"G",
"Groww":"G",
"Zerodha":"Z",
"Upstox":"U",
"AJIO":"A",
"Nykaa":"N",
"OLX":"O",
"Netflix":"N",
"JioHotstar":"J",
"ZEE5":"Z",
"JioSaavn":"J",
"Gaana":"G",
"BookMyShow":"B",
"Canva":"C",
"Speedtest":"S",
"VirusTotal":"V",
"Smallpdf":"S"

};

return icons[name] ||
name
.charAt(0)
.toUpperCase();

}


/* =========================================
   RENDER
========================================= */

function render(){

filtered =
getSites();


if(
selected >=
filtered.length
){

selected =
Math.max(
0,
filtered.length-1
);

}


count.textContent =
filtered.length;


grid.innerHTML="";


filtered.forEach(
(site,index)=>{

const card =
document.createElement(
"button"
);

card.className =
"app-card";


if(
index === selected
){

card.classList.add(
"selected"
);

}


const icon =
document.createElement(
"div"
);

icon.className =
"app-icon";

icon.textContent =
getIcon(site[1]);


const name =
document.createElement(
"div"
);

name.className =
"app-name";

name.textContent =
site[1];


card.appendChild(
icon
);

card.appendChild(
name
);


card.onclick =
function(){

openSite(site);

};


grid.appendChild(
card
);

});

}


/* =========================================
   OPEN
========================================= */

function openSite(site){

if(!site)return;


localStorage.setItem(
"webhub2_last",
JSON.stringify({
name:site[1],
url:site[2]
})
);


location.href =
site[2];

}


/* =========================================
   MOVE
========================================= */

function move(direction){

if(!filtered.length)
return;


selected +=
direction;


if(
selected < 0
){

selected =
filtered.length-1;

}


if(
selected >=
filtered.length
){

selected=0;

}


render();


const item =
grid.querySelector(
".selected"
);


if(item){

item.scrollIntoView({
block:"nearest"
});

}

}


/* =========================================
   SEARCH
========================================= */

search.addEventListener(
"input",
function(){

selected=0;

render();

});


/* =========================================
   KEYPAD
========================================= */

document.addEventListener(
"keydown",
function(e){

/* UP */

if(
e.key==="ArrowUp" ||
e.key==="2"
){

e.preventDefault();

move(-4);

}


/* DOWN */

else if(
e.key==="ArrowDown" ||
e.key==="8"
){

e.preventDefault();

move(4);

}


/* LEFT */

else if(
e.key==="ArrowLeft" ||
e.key==="4"
){

e.preventDefault();

move(-1);

}


/* RIGHT */

else if(
e.key==="ArrowRight" ||
e.key==="6"
){

e.preventDefault();

move(1);

}


/* OPEN */

else if(
e.key==="Enter" ||
e.key==="5"
){

e.preventDefault();

openSite(
filtered[selected]
);

}


/* SEARCH */

else if(
e.key==="0"
){

e.preventDefault();

search.focus();

}


/* BACK */

else if(
e.key==="#"
){

history.back();

}

});


/* =========================================
   START
========================================= */

createCategories();

render();

</script>

</body>
</html>
