<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>NETMIRROR CLOUD</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080808;color:white;font-family:Arial,sans-serif;font-size:12px}
header{background:#151515;padding:10px 8px;border-bottom:2px solid #e50914}
.logo{font-size:19px;font-weight:bold;color:#e50914}
.sub{font-size:9px;color:#aaa;margin-top:3px}
nav{display:flex;gap:5px;padding:7px;background:#111}
button{border:0;border-radius:3px;background:#292929;color:white;padding:7px 9px;font-size:11px}
button:focus,.card:focus{outline:2px solid #e50914;background:#471015}
nav button.active{background:#e50914}
input{width:100%;background:#171717;border:1px solid #444;color:white;padding:9px;border-radius:4px}
main{padding:8px}
#grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
.card{background:#171717;border:1px solid #333;border-radius:5px;overflow:hidden;min-width:0}
.poster{height:75px;background:linear-gradient(135deg,#292929,#101010);display:flex;align-items:center;justify-content:center;text-align:center;padding:5px;color:#ddd;font-size:13px;font-weight:bold}
.info{padding:6px}
.title{font-weight:bold;font-size:12px;line-height:16px}
.meta{font-size:10px;color:#aaa;margin-top:4px}
.tag{color:#e50914;font-size:9px;margin-top:4px}
#detail{display:none;background:#151515;padding:10px;border-radius:5px}
#detail h2{font-size:17px;margin:5px 0}
#desc{color:#ccc;line-height:17px;margin:8px 0}
#playerBox{display:none;background:#000;margin-top:8px}
video{width:100%;max-height:190px;background:#000}
.row{display:flex;gap:5px;flex-wrap:wrap;margin:7px 0}
.row button{flex:1}
.small{color:#aaa;font-size:10px;line-height:16px}
#status{color:#ffb4b4;font-size:10px;margin:6px 0}
footer{padding:12px;text-align:center;color:#666;font-size:9px}
.hide{display:none!important}
</style>
</head>
<body>
<header>
 <div class="logo">NETMIRROR</div>
 <div class="sub">CLOUD PHONE EDITION</div>
</header><nav>
 <button class="active" id="allBtn" onclick="setTab('all',this)">ALL</button>
 <button id="movieBtn" onclick="setTab('m',this)">MOVIES</button>
 <button id="seriesBtn" onclick="setTab('t',this)">SERIES</button>
</nav><main>
 <input id="search" placeholder="Search movies / series..." oninput="render()">
 <div class="row">
  <button onclick="showHome()">HOME</button>
  <button onclick="showLast()">LAST PLAYED</button>
 </div> <div id="grid"></div> <section id="detail">
  <button onclick="showHome()">← BACK</button>
  <h2 id="dtitle"></h2>
  <div class="small" id="dmeta"></div>
  <div id="desc"></div>
  <div class="small" id="cast"></div>
  <div class="small" id="genre"></div>
  <div class="row">
   <button onclick="addStream()">ADD / CHANGE STREAM</button>
   <button onclick="playCurrent()">▶ PLAY</button>
  </div>
  <div id="status"></div>
  <div id="playerBox">
   <video id="video" controls playsinline preload="metadata"></video>
   <div class="row">
    <button onclick="togglePlay()">PLAY / PAUSE</button>
    <button onclick="stopVideo()">STOP</button>
   </div>
  </div>
  <p class="small">Playback supports direct MP4 and HLS streams if the phone browser supports the format. Stream access must be authorized.</p>
 </section>
</main><footer>NETMIRROR CLOUD • LIGHTWEIGHT PLAYER</footer><script>
const data = [
{title:"Thangalaan",year:"2024",type:"m",runtime:"2h 28m",rating:"U/A 16+",lang:"English",director:"Pa. Ranjith",cast:"Vikram, Parvathy, Malavika Mohanan, Daniel Caltagirone, Pasupathy",genre:"Action & Adventure Movies, Tamil-Language Movies",desc:"To defeat an oppressive landlord, a tribal leader joins a British explorer in a risky search for gold in terrain protected by a feared mystical force."},
{title:"Animal",year:"2023",type:"m",runtime:"3h 21m",rating:"U/A 18+ [A]",lang:"English",director:"Sandeep Reddy Vanga",cast:"Ranbir Kapoor, Anil Kapoor, Bobby Deol, Rashmika Mandanna, Triptii Dimri",genre:"Hindi-Language Movies, Bollywood Movies, Crime Movies, Action & Adventure",desc:"A turbulent story of family, loyalty and violence."},
{title:"Shadow and Bone",year:"2021",type:"t",runtime:"2 Seasons",rating:"U/A 16+",lang:"English",director:"",cast:"Jessie Mei Li, Archie Renaux, Ben Barnes, Freddy Carter, Amita Suman",genre:"Fantasy, TV Dramas",desc:"A young soldier discovers a power that could unite her world."},
{title:"Vincenzo",year:"2021",type:"t",runtime:"1 Season",rating:"U/A 16+",lang:"English",director:"",cast:"Song Joong-ki, Jeon Yeo-been, Ok Taec-yeon, Yoo Jae-myung",genre:"TV Dramas, Korean, TV Comedies",desc:"A Korean-Italian mafia lawyer returns to Korea."},
{title:"Friends",year:"1994",type:"t",runtime:"10 Seasons",rating:"U/A 13+",lang:"English",director:"",cast:"Jennifer Aniston, Courteney Cox, Lisa Kudrow, Matt LeBlanc, Matthew Perry, David Schwimmer",genre:"Sitcoms, TV Comedies, US TV Shows",desc:"Six friends navigate life, love and friendship in New York."},
{title:"Vettaiyan",year:"2024",type:"m",runtime:"2h 41m",rating:"U/A 13+",lang:"English",director:"T.J. Gananavel",cast:"Rajinikanth, Amitabh Bachchan, Fahadh Faasil, Rana Daggubati, Manju Warrier",genre:"Drama, Action",desc:"A police officer confronts a complex case and questions of justice."},
{title:"Drishyam 2 (Hindi)",year:"2022",type:"m",runtime:"2h 19m",rating:"U/A 13+",lang:"Hindi",director:"Abhishek Pathak",cast:"Ajay Devgn, Shriya Saran, Tabu, Akshaye Khanna, Ishita Dutta",genre:"Suspense, Drama, International",desc:"A family faces the consequences of a crime and an investigation."},
{title:"Pathaan",year:"2023",type:"m",runtime:"2h 29m",rating:"U/A 13+",lang:"English",director:"Siddharth Anand",cast:"Shah Rukh Khan, Deepika Padukone, John Abraham, Dimple Kapadia",genre:"Action, Suspense, International, Adventure",desc:"An Indian agent takes on a dangerous mission."},
{title:"The Flash",year:"2015",type:"t",runtime:"Series",rating:"U/A 13+",lang:"English",director:"Mario Azzopardi, Bruce Bilson",cast:"Grant Gustin, Candice Patton, Danielle Panabaker, Carlos Valdes",genre:"Action, Fantasy, Science Fiction, Adventure",desc:"A fast-paced superhero story about a man with extraordinary speed."},
{title:"Mirzapur",year:"2018",type:"t",runtime:"Series",rating:"U/A 18+ [A]",lang:"English",director:"",cast:"Ali Fazal, Vikrant Massey, Pankaj Tripathi, Divyenndu, Shweta Tripathi",genre:"Drama",desc:"A story of power, crime and rivalry."},
{title:"The Summer I Turned Pretty",year:"2022",type:"t",runtime:"Series",rating:"U/A 16+",lang:"English",director:"Jesse Peretz, Jeff Chan, Erica Dunton",cast:"Lola Tung, Jackie Chung, Rachel Blanchard, Christopher Briney",genre:"Drama, Romance",desc:"A coming-of-age story about love, friendship and family."}
];

let tab="all", current=null;
const streamsKey="nm_authorized_streams";
function streams(){try{return JSON.parse(localStorage.getItem(streamsKey)||"{}")}catch(e){return {}}}
function saveStreams(x){localStorage.setItem(streamsKey,JSON.stringify(x))}
function render(){
 const q=document.getElementById("search").value.toLowerCase();
 let list=data.filter(x=>(tab==="all"||x.type===tab)&&
 (x.title+" "+x.year+" "+x.genre+" "+x.cast).toLowerCase().includes(q));
 document.getElementById("grid").innerHTML=list.map(x=>{
 let i=data.indexOf(x);
 return `<div class="card" tabindex="0" onclick="openDetail(${i})" onkeydown="if(event.key==='Enter')openDetail(${i})">
 <div class="poster">${x.title}</div><div class="info">
 <div class="title">${x.title}</div>
 <div class="meta">${x.year} • ${x.runtime}</div>
 <div class="tag">${x.type==="m"?"MOVIE":"SERIES"} • ${x.rating}</div>
 </div></div>`;
 }).join("");
}
function setTab(t,b){
 tab=t;
 document.querySelectorAll("nav button").forEach(x=>x.classList.remove("active"));
 b.classList.add("active");showHome();render();
}
function showHome(){
 document.getElementById("detail").style.display="none";
 document.getElementById("grid").style.display="grid";
 document.getElementById("search").style.display="block";
 document.getElementById("playerBox").style.display="none";
}
function openDetail(i){
 current=data[i];
 document.getElementById("grid").style.display="none";
 document.getElementById("search").style.display="none";
 document.getElementById("detail").style.display="block";
 document.getElementById("dtitle").textContent=current.title;
 document.getElementById("dmeta").textContent=current.year+" • "+current.runtime+" • "+current.rating;
 document.getElementById("desc").textContent=current.desc;
 document.getElementById("cast").textContent="CAST: "+current.cast;
 document.getElementById("genre").textContent="GENRE: "+current.genre;
 document.getElementById("status").textContent=streams()[current.title]?"Stream URL saved on this device.":"No stream URL saved.";
 document.getElementById("playerBox").style.display="none";
}
function addStream(){
 if(!current)return;
 let old=streams()[current.title]||"";
 let u=prompt("Enter your authorized direct MP4 or HLS (.m3u8) URL:",old);
 if(u===null)return;
 u=u.trim();
 if(!u)return;
 if(!/^https?:\/\//i.test(u)){alert("Please enter a valid http/https URL.");return}
 let s=streams();s[current.title]=u;saveStreams(s);
 document.getElementById("status").textContent="Stream URL saved.";
}
function playCurrent(){
 if(!current)return;
 let u=streams()[current.title];
 if(!u){document.getElementById("status").textContent="Add an authorized MP4 or HLS stream URL first.";return}
 let v=document.getElementById("video");
 document.getElementById("playerBox").style.display="block";
 v.pause();v.removeAttribute("src");v.load();
 v.src=u;v.load();
 v.play().then(()=>{document.getElementById("status").textContent="Playing.";})
 .catch(e=>{document.getElementById("status").textContent="Playback failed. Browser may not support this format, or the server may block access (CORS/auth).";});
 v.onerror=()=>{document.getElementById("status").textContent="Video error: unsupported format or stream unavailable."};
 localStorage.setItem("nm_last",current.title);
}
function togglePlay(){
 let v=document.getElementById("video");
 if(v.paused)v.play().catch(()=>{});else v.pause();
}
function stopVideo(){
 let v=document.getElementById("video");v.pause();v.removeAttribute("src");v.load();
 document.getElementById("playerBox").style.display="none";
}
function showLast(){
 let name=localStorage.getItem("nm_last");
 let i=data.findIndex(x=>x.title===name);
 if(i>=0)openDetail(i);else alert("No recently played title.");
}
document.addEventListener("keydown",e=>{
 if(e.key==="Escape"||e.key==="Backspace"){
  if(document.getElementById("detail").style.display==="block"){stopVideo();showHome();}
 }
});
render();
</script></body>
</html>
