<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RUTIK CINEMA</title><style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#101014;
 color:white;
 font-family:Arial,sans-serif;
 font-size:13px;
}
header{
 background:#19191f;
 padding:10px 7px;
 text-align:center;
 border-bottom:2px solid #e50914;
}
.logo{
 font-size:19px;
 font-weight:bold;
 color:#e50914;
}
.sub{font-size:10px;color:#aaa;margin-top:3px}
nav{
 display:flex;
 overflow-x:auto;
 background:#202027;
 padding:5px 2px;
}
nav button{
 flex-shrink:0;
 background:#303039;
 color:white;
 border:0;
 padding:8px;
 margin:2px;
 font-size:11px;
}
nav button.active{background:#e50914}
input{
 width:100%;
 padding:10px;
 background:#24242c;
 border:1px solid #555;
 color:white;
 outline:none;
}
button{cursor:pointer}
#searchBox{padding:7px}
#status{
 color:#aaa;
 padding:7px;
 font-size:11px;
}
#movieList{padding:5px}
.movie{
 display:flex;
 gap:8px;
 padding:7px 3px;
 border-bottom:1px solid #303039;
 min-height:83px;
}
.poster{
 width:53px;
 height:70px;
 object-fit:cover;
 background:#292930;
 flex-shrink:0;
}
.info{flex:1;min-width:0}
.title{
 font-size:13px;
 font-weight:bold;
 margin:2px 0 5px;
}
.meta{font-size:10px;color:#aaa;margin-bottom:5px}
.smallbtn{
 background:#e50914;
 color:white;
 border:0;
 padding:6px 8px;
 font-size:11px;
 margin:2px 2px 2px 0;
}
.graybtn{background:#383840}
#pages{
 text-align:center;
 padding:10px;
}
#pages button{
 background:#303039;
 color:white;
 border:0;
 padding:8px 12px;
 margin:3px;
}
#detail{
 display:none;
 padding:10px;
}
#detail img{
 width:85px;
 height:115px;
 object-fit:cover;
 float:left;
 margin:0 10px 8px 0;
}
#detailTitle{font-size:16px;font-weight:bold}
#detailText{font-size:11px;color:#ccc;line-height:1.5}
#player{
 display:none;
 padding:7px;
 background:#000;
}
#video{
 width:100%;
 max-height:230px;
 background:black;
}
.playerTitle{
 font-size:12px;
 padding:7px 0;
 color:#ddd;
}
.playerControls{
 display:flex;
 justify-content:center;
 flex-wrap:wrap;
 gap:5px;
 margin:6px 0;
}
.playerControls button{
 background:#303039;
 color:white;
 border:1px solid #555;
 padding:9px 11px;
 font-size:12px;
}
#timeInfo{
 text-align:center;
 color:#ccc;
 font-size:11px;
 padding:5px;
}
#seekbar{
 width:100%;
 margin:5px 0;
}
#watchlist{display:none;padding:8px}
footer{
 text-align:center;
 color:#777;
 font-size:10px;
 padding:15px 5px;
}
</style></head><body><header>
 <div class="logo">RUTIK CINEMA</div>
 <div class="sub">MOVIES • SERIES • ENTERTAINMENT</div>
</header><nav>
 <button class="active" onclick="setCategory('hindi',this)">HINDI</button>
 <button onclick="setCategory('indian',this)">INDIAN</button>
 <button onclick="setCategory('dubbed',this)">DUBBED</button>
 <button onclick="showMyList(this)">MY LIST</button>
 <button onclick="setCategory('all',this)">ALL</button>
</nav><div id="searchBox">
 <input id="searchInput" type="search"
 placeholder="Search movies..."
 onkeydown="if(event.key==='Enter')searchMovies()">
 <button class="smallbtn" onclick="searchMovies()">SEARCH</button>
</div><div id="status">Loading movies...</div><div id="movieList"></div><div id="pages">
 <button onclick="changePage(-1)">PREVIOUS</button>
 <span id="pageNumber">1</span>
 <button onclick="changePage(1)">NEXT</button>
</div><div id="detail">
 <button class="smallbtn graybtn" onclick="closeDetail()">BACK</button>
 <br><br>
 <img id="detailPoster" src="" alt="">
 <div id="detailTitle"></div>
 <div id="detailText"></div>
 <div style="clear:both"></div>
 <button class="smallbtn" onclick="playSelected()">PLAY</button>
 <button class="smallbtn graybtn" onclick="addWatchlist()">ADD TO MY LIST</button>
</div><div id="watchlist">
 <h3>MY LIST</h3>
 <div id="myListItems"></div>
 <button class="smallbtn graybtn" onclick="closeMyList()">BACK</button>
</div><div id="player">
 <div class="playerTitle" id="playingTitle">RUTIK CINEMA PLAYER</div><video id="video" controls playsinline preload="metadata"></video>

 <div id="timeInfo">00:00 / 00:00</div>
 <input type="range" id="seekbar" min="0" max="1000" value="0"> <div class="playerControls">
  <button onclick="seekVideo(-10)">⏪ 10 SEC</button>
  <button onclick="togglePlay()">▶ / ❚❚</button>
  <button onclick="seekVideo(10)">10 SEC ⏩</button>
 </div> <div class="playerControls">
  <button onclick="restartVideo()">RESTART</button>
  <button onclick="stopVideo()">STOP</button>
  <button onclick="closePlayer()">BACK</button>
 </div> <div id="playerStatus" style="color:#aaa;text-align:center;font-size:10px;padding:5px">
  Arrow keys: Forward / Backward | OK: Play/Pause
 </div>
</div><footer>
 RUTIK CINEMA • Publicly accessible catalogue
</footer><script>
const API="https://archive.org/advancedsearch.php";
const META="https://archive.org/metadata/";
const IMG="https://archive.org/services/img/";

let category="hindi";
let currentPage=1;
let pageSize=8;
let currentItems=[];
let selectedMovie=null;
let currentFile=null;
let lastQuery="";
let searchMode=false;
let requestController=null;

const video=document.getElementById("video");

function setStatus(t){
 document.getElementById("status").textContent=t;
}

function makeQuery(){
 if(category==="hindi")
  return 'mediatype:movies AND language:hin';
 if(category==="indian")
  return 'mediatype:movies AND (subject:India OR subject:Indian)';
 if(category==="dubbed")
  return 'mediatype:movies AND ("Hindi dubbed" OR "Hindi Dubbed")';
 return 'mediatype:movies';
}

function setCategory(c,btn){
 category=c;
 currentPage=1;
 searchMode=false;
 document.getElementById("searchInput").value="";
 document.querySelectorAll("nav button").forEach(b=>b.classList.remove("active"));
 if(btn)btn.classList.add("active");
 document.getElementById("detail").style.display="none";
 document.getElementById("watchlist").style.display="none";
 document.getElementById("movieList").style.display="block";
 document.getElementById("pages").style.display="block";
 loadMovies();
}

async function loadMovies(){
 const q=searchMode?lastQuery:makeQuery();
 lastQuery=q;
 await fetchMovies(q);
}

async function searchMovies(){
 const value=document.getElementById("searchInput").value.trim();
 if(!value)return;
 searchMode=true;
 currentPage=1;
 lastQuery='mediatype:movies AND title:('+value+')';
 document.getElementById("detail").style.display="none";
 document.getElementById("watchlist").style.display="none";
 document.getElementById("movieList").style.display="block";
 document.getElementById("pages").style.display="block";
 await fetchMovies(lastQuery);
}

async function fetchMovies(q){
 if(requestController)requestController.abort();
 requestController=new AbortController();

 setStatus("Searching...");
 document.getElementById("movieList").innerHTML="";

 const start=(currentPage-1)*pageSize;
 const url=API+"?q="+encodeURIComponent(q)+
 "&fl[]=identifier&fl[]=title&fl[]=year&fl[]=description&fl[]=creator"+
 "&rows="+pageSize+"&start="+start+"&output=json";

 try{
  const r=await fetch(url,{signal:requestController.signal});
  const data=await r.json();
  currentItems=data.response.docs||[];

  renderMovies(currentItems);
  document.getElementById("pageNumber").textContent=currentPage;
  setStatus("Results: "+data.response.numFound);
 }catch(e){
  if(e.name!=="AbortError")setStatus("Network error. Try again.");
 }
}

function renderMovies(items){
 const box=document.getElementById("movieList");
 box.innerHTML="";

 if(!items.length){
  box.innerHTML="<p>No movies found.</p>";
  return;
 }

 items.forEach(movie=>{
  const row=document.createElement("div");
  row.className="movie";

  const poster=document.createElement("img");
  poster.className="poster";
  poster.loading="lazy";
  poster.src=IMG+encodeURIComponent(movie.identifier);
  poster.onerror=function(){this.style.display="none"};

  const info=document.createElement("div");
  info.className="info";

  const title=document.createElement("div");
  title.className="title";
  title.textContent=movie.title||movie.identifier;

  const meta=document.createElement("div");
  meta.className="meta";
  meta.textContent=(movie.year||"Year unknown")+" • "+(movie.creator||"");

  const btn=document.createElement("button");
  btn.className="smallbtn";
  btn.textContent="DETAILS";
  btn.onclick=()=>openDetail(movie);

  info.appendChild(title);
  info.appendChild(meta);
  info.appendChild(btn);

  row.appendChild(poster);
  row.appendChild(info);
  box.appendChild(row);
 });
}

function changePage(n){
 const next=currentPage+n;
 if(next<1)return;
 currentPage=next;
 loadMovies();
}

async function openDetail(movie){
 selectedMovie=movie;
 document.getElementById("movieList").style.display="none";
 document.getElementById("pages").style.display="none";
 document.getElementById("detail").style.display="block";
 document.getElementById("detailTitle").textContent=movie.title||"Movie";
 document.getElementById("detailPoster").src=IMG+encodeURIComponent(movie.identifier);
 document.getElementById("detailText").textContent="Loading details...";

 try{
  const r=await fetch(META+encodeURIComponent(movie.identifier));
  const data=await r.json();
  const m=data.metadata||{};
  const description=Array.isArray(m.description)?m.description.join(" "):(m.description||movie.description||"Description unavailable.");
  const license=m.licenseurl||"Not specified in metadata";
  document.getElementById("detailText").textContent=
   "Year: "+(m.year||movie.year||"Unknown")+
   "\nCreator: "+(m.creator||movie.creator||"Unknown")+
   "\nLanguage: "+(m.language||"Unknown")+
   "\nLicense: "+license+
   "\n\n"+description.substring(0,900);
 }catch(e){
  document.getElementById("detailText").textContent=movie.description||"Details unavailable.";
 }
}

function closeDetail(){
 document.getElementById("detail").style.display="none";
 document.getElementById("movieList").style.display="block";
 document.getElementById("pages").style.display="block";
}

async function playSelected(){
 if(!selectedMovie)return;

 const accepted=confirm(
 "Play this file only if you have the right to access and watch it. Internet Archive metadata does not guarantee that a title is legally distributable."
 );
 if(!accepted)return;

 setStatus("Checking available files...");

 try{
  const r=await fetch(META+encodeURIComponent(selectedMovie.identifier));
  const data=await r.json();
  const files=data.files||[];

  const candidates=files.filter(f=>{
   const name=(f.name||"").toLowerCase();
   return (name.endsWith(".mp4")||name.endsWith(".m3u8")) &&
          !name.includes("sample") &&
          !name.includes("trailer");
  });

  if(!candidates.length){
   alert("No compatible MP4 or M3U8 file found.");
   return;
  }

  candidates.sort((a,b)=>{
   const am=a.name.toLowerCase().endsWith(".mp4")?0:1;
   const bm=b.name.toLowerCase().endsWith(".mp4")?0:1;
   if(am!==bm)return am-bm;
   return (Number(b.size)||0)-(Number(a.size)||0);
  });

  currentFile=candidates[0];
  const parts=currentFile.name.split("/").map(encodeURIComponent).join("/");
  const src="https://archive.org/download/"+
   encodeURIComponent(selectedMovie.identifier)+"/"+parts;

  startPlayer(src,selectedMovie.title||"Movie");

 }catch(e){
  alert("Unable to load video information. Check internet.");
 }
}

function startPlayer(src,title){
 document.getElementById("detail").style.display="none";
 document.getElementById("player").style.display="block";
 document.getElementById("playingTitle").textContent=title;
 document.getElementById("playerStatus").textContent="Loading video...";
 video.pause();
 video.removeAttribute("src");
 video.load();
 video.src=src;
 video.load();

 video.play().then(()=>{
  document.getElementById("playerStatus").textContent="Playing";
 }).catch(()=>{
  document.getElementById("playerStatus").textContent="Press Play to start. Seeking depends on stream support.";
 });
}

function seekVideo(seconds){
 try{
  if(!isFinite(video.duration)||video.duration<=0){
   document.getElementById("playerStatus").textContent="Seeking unavailable for this stream.";
   return;
  }
  let target=video.currentTime+seconds;
  target=Math.max(0,Math.min(target,video.duration));

  if(video.seekable.length){
   let found=false;
   for(let i=0;i<video.seekable.length;i++){
    const start=video.seekable.start(i);
    const end=video.seekable.end(i);
    if(target>=start&&target<=end){found=true;break;}
   }
   if(!found){
    document.getElementById("playerStatus").textContent="This video does not support seeking at that position.";
    return;
   }
  }
  video.currentTime=target;
 }catch(e){
  document.getElementById("playerStatus").textContent="Seeking not supported by this stream.";
 }
}

function togglePlay(){
 if(video.paused)video.play().catch(()=>{});
 else video.pause();
}

function restartVideo(){
 try{
  video.currentTime=0;
  video.play().catch(()=>{});
 }catch(e){}
}

function stopVideo(){
 video.pause();
 try{video.currentTime=0}catch(e){}
}

function closePlayer(){
 video.pause();
 video.removeAttribute("src");
 video.load();
 document.getElementById("player").style.display="none";
 document.getElementById("detail").style.display="block";
}

function formatTime(s){
 if(!isFinite(s))return "00:00";
 const m=Math.floor(s/60);
 const sec=Math.floor(s%60);
 return String(m).padStart(2,"0")+":"+String(sec).padStart(2,"0");
}

video.addEventListener("timeupdate",()=>{
 const current=video.currentTime||0;
 const total=video.duration;
 document.getElementById("timeInfo").textContent=
  formatTime(current)+" / "+formatTime(total);

 if(isFinite(total)&&total>0){
  document.getElementById("seekbar").value=(current/total)*1000;
 }
});

video.addEventListener("waiting",()=>{
 document.getElementById("playerStatus").textContent="Buffering...";
});
video.addEventListener("playing",()=>{
 document.getElementById("playerStatus").textContent="Playing";
});
video.addEventListener("error",()=>{
 document.getElementById("playerStatus").textContent="Video could not be played. Try another file.";
});

document.getElementById("seekbar").addEventListener("change",function(){
 if(isFinite(video.duration)&&video.duration>0){
  video.currentTime=(Number(this.value)/1000)*video.duration;
 }
});

document.addEventListener("keydown",function(e){
 if(document.getElementById("player").style.display!=="block")return;

 if(e.key==="ArrowRight"){
  e.preventDefault();
  seekVideo(10);
 }
 else if(e.key==="ArrowLeft"){
  e.preventDefault();
  seekVideo(-10);
 }
 else if(e.key==="Enter"||e.key===" "){
  e.preventDefault();
  togglePlay();
 }
 else if(e.key==="0"){
  e.preventDefault();
  restartVideo();
 }
 else if(e.key==="Escape"||e.key==="Backspace"){
  e.preventDefault();
  closePlayer();
 }
});

function getList(){
 try{return JSON.parse(localStorage.getItem("rutik_list")||"[]")}
 catch(e){return []}
}

function addWatchlist(){
 if(!selectedMovie)return;
 let list=getList();
 if(!list.some(x=>x.identifier===selectedMovie.identifier)){
  list.push({
   identifier:selectedMovie.identifier,
   title:selectedMovie.title,
   year:selectedMovie.year
  });
  localStorage.setItem("rutik_list",JSON.stringify(list));
 }
 alert("Added to My List");
}

function showMyList(btn){
 document.getElementById("movieList").style.display="none";
 document.getElementById("pages").style.display="none";
 document.getElementById("detail").style.display="none";
 document.getElementById("watchlist").style.display="block";
 document.querySelectorAll("nav button").forEach(b=>b.classList.remove("active"));
 if(btn)btn.classList.add("active");

 const box=document.getElementById("myListItems");
 box.innerHTML="";
 const list=getList();

 if(!list.length){
  box.textContent="Your list is empty.";
  return;
 }

 list.forEach(m=>{
  const row=document.createElement("div");
  row.className="movie";
  const t=document.createElement("div");
  t.className="info";
  t.textContent=m.title||m.identifier;

  const b=document.createElement("button");
  b.className="smallbtn";
  b.textContent="OPEN";
  b.onclick=()=>openDetail(m);

  const del=document.createElement("button");
  del.className="smallbtn graybtn";
  del.textContent="REMOVE";
  del.onclick=()=>{
   let updated=getList().filter(x=>x.identifier!==m.identifier);
   localStorage.setItem("rutik_list",JSON.stringify(updated));
   showMyList(document.querySelector("nav button:nth-child(4)"));
  };

  row.appendChild(t);
  row.appendChild(b);
  row.appendChild(del);
  box.appendChild(row);
 });
}

function closeMyList(){
 document.getElementById("watchlist").style.display="none";
 document.getElementById("movieList").style.display="block";
 document.getElementById("pages").style.display="block";
}

loadMovies();
</script></body>
</html>
