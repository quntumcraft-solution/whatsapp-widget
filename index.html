<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>RUTIK CINEMA</title><style>
*{box-sizing:border-box}
body{
 margin:0;background:#080808;color:#fff;
 font-family:Arial,sans-serif;font-size:12px
}
header{
 background:#151515;padding:9px 7px;
 border-bottom:2px solid #e50914
}
.logo{font-size:19px;font-weight:bold;color:#e50914}
.sub{font-size:9px;color:#aaa;margin-top:3px}
nav{
 display:flex;gap:4px;padding:6px;
 background:#111;overflow-x:auto
}
button{
 border:0;border-radius:4px;background:#292929;
 color:white;padding:8px 9px;font-size:11px;
 white-space:nowrap
}
button:focus,.movie:focus,input:focus{
 outline:2px solid #e50914;background:#401015
}
.active{background:#e50914}
main{padding:6px}
input{
 width:100%;padding:9px;background:#171717;
 border:1px solid #444;color:white;
 border-radius:4px;margin-bottom:6px;font-size:12px
}
#grid{display:block}
.movie{
 display:flex;gap:8px;padding:6px;
 background:#151515;border-bottom:1px solid #333;
 min-height:76px;align-items:center
}
.poster{
 width:48px;height:64px;flex-shrink:0;
 background:#252525;border-radius:3px;
 display:flex;align-items:center;justify-content:center;
 overflow:hidden;text-align:center;color:#aaa;
 font-size:9px
}
.poster img{width:100%;height:100%;object-fit:cover}
.details{min-width:0;flex:1}
.name{
 font-size:13px;font-weight:bold;
 line-height:17px;overflow-wrap:anywhere
}
.meta{font-size:10px;color:#aaa;margin-top:5px;line-height:14px}
.tag{font-size:9px;color:#e50914;margin-top:4px}
#loading{padding:12px;text-align:center;color:#bbb}
#pageInfo{text-align:center;color:#aaa;padding:7px;font-size:10px}
#detail{
 display:none;background:#151515;padding:8px;
 border-radius:5px
}
#detail h2{font-size:16px;line-height:20px}
#desc{color:#ccc;line-height:17px}
#playerBox{display:none;background:#000;margin-top:8px}
video{width:100%;max-height:190px;background:#000}
.row{display:flex;gap:5px;margin:7px 0;flex-wrap:wrap}
.row button{flex:1}
.small{font-size:10px;color:#aaa;line-height:16px}
#status{font-size:10px;color:#ffb4b4;margin:7px 0;line-height:15px}
footer{text-align:center;color:#666;padding:12px;font-size:9px}
</style></head><body><header>
 <div class="logo">RUTIK CINEMA</div>
 <div class="sub">MOVIES • HINDI • ENTERTAINMENT</div>
</header><nav>
 <button class="active" onclick="category('hindi',this)">HINDI</button>
 <button onclick="category('indian',this)">INDIAN</button>
 <button onclick="category('dubbed',this)">HINDI DUBBED</button>
 <button onclick="showWatchlist(this)">MY LIST</button>
</nav><main><input id="search" placeholder="Search movie name..." 
onkeydown="if(event.key==='Enter')searchMovies()">

<div class="row">
 <button onclick="searchMovies()">SEARCH</button>
 <button onclick="showRecent()">RECENT</button>
</div><div id="loading">Loading Hindi Movies...</div>
<div id="grid"></div>
<div id="pageInfo"></div><div class="row" id="pagination">
 <button onclick="changePage(-1)">PREVIOUS</button>
 <button onclick="changePage(1)">NEXT</button>
</div><section id="detail">
 <button onclick="goBack()">← BACK</button> <h2 id="dtitle"></h2>
 <div class="small" id="dmeta"></div>
 <p id="desc"></p>
 <div class="small" id="rights"></div> <div class="row">
  <button onclick="playMovie()">▶ PLAY</button>
  <button onclick="toggleWatchlist()">+ MY LIST</button>
 </div> <div id="status"></div> <div id="playerBox">
  <video id="video" controls playsinline preload="none"></video>
  <div class="row">
   <button onclick="togglePlay()">PLAY / PAUSE</button>
   <button onclick="stopVideo()">STOP</button>
  </div>
 </div> <div class="small" id="fileInfo"></div>
</section></main><footer>RUTIK CINEMA V2 • CLOUD PHONE</footer><script>
const API="https://archive.org";

let currentCategory="hindi";
let currentPage=0;
let current=null;
let currentFile=null;
let results=[];
let lastQuery="";
let controller=null;
let requestNumber=0;

const grid=document.getElementById("grid");
const loading=document.getElementById("loading");
const detail=document.getElementById("detail");
const video=document.getElementById("video");

const CACHE_TIME=30*60*1000;

function cacheGet(key){
 try{
  const x=JSON.parse(sessionStorage.getItem(key)||"null");
  if(x && Date.now()-x.time<CACHE_TIME)return x.data;
 }catch(e){}
 return null;
}

function cacheSet(key,data){
 try{
  sessionStorage.setItem(key,JSON.stringify({
   time:Date.now(),data:data
  }));
 }catch(e){}
}

function status(text){
 document.getElementById("status").textContent=text;
}

function showLoading(text){
 loading.style.display="block";
 loading.textContent=text;
}

function hideLoading(){
 loading.style.display="none";
}

function makeQuery(){
 if(currentCategory==="hindi")
  return 'mediatype:movies AND language:hin';

 if(currentCategory==="indian")
  return 'mediatype:movies AND language:hin AND (subject:India OR subject:Indian)';

 if(currentCategory==="dubbed")
  return 'mediatype:movies AND (title:"Hindi dubbed" OR description:"Hindi dubbed" OR title:"Hindi dub")';

 return 'mediatype:movies AND language:hin';
}

function category(type,btn){
 currentCategory=type;
 currentPage=0;

 document.querySelectorAll("nav button").forEach(b=>b.classList.remove("active"));
 if(btn)btn.classList.add("active");

 document.getElementById("search").value="";
 document.getElementById("search").style.display="block";

 stopVideo();
 detail.style.display="none";

 loadMovies();
}

function searchMovies(){
 const q=document.getElementById("search").value.trim();
 if(!q)return;

 currentPage=0;
 const safe=q.replace(/[+\-&|!(){}[\]^"~*?:\\/]/g," ").trim();

 let query='mediatype:movies AND language:hin AND title:('+safe+')';

 if(currentCategory==="dubbed")
  query='mediatype:movies AND (title:('+safe+') OR description:('+safe+'))';

 lastQuery=query;
 loadMovies(query);
}

async function loadMovies(customQuery){
 const query=customQuery||makeQuery();

 lastQuery=query;
 const thisRequest=++requestNumber;

 if(controller)controller.abort();
 controller=new AbortController();

 stopVideo();
 detail.style.display="none";
 grid.style.display="block";
 grid.innerHTML="";

 showLoading("Loading movies...");
 document.getElementById("pageInfo").textContent="";

 const cacheKey="rc2_"+query+"_"+currentPage;
 const cached=cacheGet(cacheKey);

 if(cached){
  results=cached;
  hideLoading();
  renderMovies();
  return;
 }

 try{
  const fields=[
   "identifier","title","year","description",
   "creator","language","licenseurl","subject"
  ];

  const params=new URLSearchParams();
  params.set("q",query);
  fields.forEach(f=>params.append("fl[]",f));
  params.set("rows","8");
  params.set("page",String(currentPage+1));
  params.set("output","json");

  const url=API+"/advancedsearch.php?"+params.toString();

  const response=await fetch(url,{
   signal:controller.signal
  });

  if(!response.ok)throw Error("Search error");

  const data=await response.json();

  if(thisRequest!==requestNumber)return;

  results=data.response.docs||[];

  cacheSet(cacheKey,results);

  hideLoading();

  if(!results.length){
   showLoading("No movies found. Try another search.");
   return;
  }

  renderMovies();

 }catch(e){
  if(e.name==="AbortError")return;
  if(thisRequest!==requestNumber)return;
  showLoading("Internet error. Please try again.");
 }
}

function renderMovies(){
 grid.innerHTML="";

 results.forEach((m,index)=>{
  const card=document.createElement("div");
  card.className="movie";
  card.tabIndex=0;

  const poster=document.createElement("div");
  poster.className="poster";
  poster.textContent="POSTER";

  const info=document.createElement("div");
  info.className="details";

  const name=document.createElement("div");
  name.className="name";
  name.textContent=m.title||m.identifier;

  const meta=document.createElement("div");
  meta.className="meta";
  meta.textContent=(m.year||"Year unknown")+" • "+(m.language||"Hindi");

  const tag=document.createElement("div");
  tag.className="tag";
  tag.textContent="MOVIE";

  info.append(name,meta,tag);
  card.append(poster,info);

  card.onclick=()=>openMovie(index);
  card.onkeydown=e=>{
   if(e.key==="Enter")openMovie(index);
  };

  grid.appendChild(card);

  const img=new Image();
  img.loading="lazy";
  img.src=API+"/services/img/"+encodeURIComponent(m.identifier);

  img.onload=()=>{
   poster.textContent="";
   poster.appendChild(img);
  };
 });

 document.getElementById("pageInfo").textContent=
  "PAGE "+(currentPage+1)+" • "+results.length+" MOVIES";
}

function changePage(direction){
 currentPage=Math.max(0,currentPage+direction);
 loadMovies(lastQuery||makeQuery());
}

async function openMovie(index){
 current=results[index];
 if(!current)return;

 stopVideo();
 currentFile=null;

 grid.style.display="none";
 document.getElementById("pagination").style.display="none";
 document.getElementById("search").style.display="none";
 detail.style.display="block";

 document.getElementById("dtitle").textContent=current.title||current.identifier;
 document.getElementById("dmeta").textContent=
  (current.year||"Year unknown")+" • "+(current.language||"Language not specified");

 document.getElementById("desc").textContent=
  current.description||"No description available.";

 document.getElementById("rights").textContent=
  "License information: "+(current.licenseurl||"Not specified. Please check the item's rights page.");

 document.getElementById("fileInfo").textContent="";
 document.getElementById("playerBox").style.display="none";

 status("Checking video files...");

 try{
  const key="rc2_meta_"+current.identifier;
  let metadata=cacheGet(key);

  if(!metadata){
   const response=await fetch(API+"/metadata/"+encodeURIComponent(current.identifier));
   if(!response.ok)throw Error("Metadata error");
   metadata=await response.json();
   cacheSet(key,metadata);
  }

  const files=metadata.files||[];

  const candidates=files.filter(f=>{
   if(!f.name)return false;
   const n=f.name.toLowerCase();
   return (n.endsWith(".mp4")||n.endsWith(".m3u8")) &&
    Number(f.size||0)>500000;
  });

  candidates.sort((a,b)=>{
   const aa=a.name.toLowerCase().endsWith(".mp4")?0:1;
   const bb=b.name.toLowerCase().endsWith(".mp4")?0:1;
   if(aa!==bb)return aa-bb;
   return Number(a.size||0)-Number(b.size||0);
  });

  if(!candidates.length){
   status("No suitable MP4 or HLS file found.");
   return;
  }

  currentFile=candidates[0];

  document.getElementById("fileInfo").textContent=
   "File: "+currentFile.name+" • "+formatSize(currentFile.size);

  status("Video file found. Press PLAY.");

 }catch(e){
  status("Could not load video information. Try again.");
 }
}

function formatSize(size){
 size=Number(size||0);
 if(size>1073741824)return (size/1073741824).toFixed(2)+" GB";
 return (size/1048576).toFixed(1)+" MB";
}

function playMovie(){
 if(!current||!currentFile){
  status("No playable video file found.");
  return;
 }

 const confirmRights=confirm(
  "RIGHTS NOTICE\n\n"+
  "Please check the video's rights and confirm you are permitted to watch it.\n\n"+
  "Continue to player?"
 );

 if(!confirmRights)return;

 const url=API+"/download/"+
  encodeURIComponent(current.identifier)+"/"+
  currentFile.name.split("/").map(encodeURIComponent).join("/");

 video.pause();
 video.removeAttribute("src");
 video.load();

 video.src=url;
 video.load();

 document.getElementById("playerBox").style.display="block";
 status("Loading video...");

 video.play().then(()=>{
  status("Playing movie.");
  saveRecent(current);
 }).catch(()=>{
  status("Playback failed. The file may be unsupported or unavailable.");
 });

 video.onerror=()=>{
  status("Video error. Try another file or movie.");
 };
}

function togglePlay(){
 if(video.paused)video.play().catch(()=>{});
 else video.pause();
}

function stopVideo(){
 video.pause();
 video.removeAttribute("src");
 video.load();
 document.getElementById("playerBox").style.display="none";
}

function goBack(){
 stopVideo();
 detail.style.display="none";
 grid.style.display="block";
 document.getElementById("pagination").style.display="flex";
 document.getElementById("search").style.display="block";
}

function getList(key){
 try{return JSON.parse(localStorage.getItem(key)||"[]")}
 catch(e){return []}
}

function toggleWatchlist(){
 if(!current)return;

 let list=getList("rc2_watch");
 const i=list.findIndex(x=>x.identifier===current.identifier);

 if(i>=0)list.splice(i,1);
 else list.push(current);

 localStorage.setItem("rc2_watch",JSON.stringify(list));
 alert(i>=0?"Removed from My List":"Added to My List");
}

function saveRecent(movie){
 let list=getList("rc2_recent");
 list=list.filter(x=>x.identifier!==movie.identifier);
 list.unshift(movie);
 localStorage.setItem("rc2_recent",JSON.stringify(list.slice(0,20)));
}

function showWatchlist(btn){
 stopVideo();

 document.querySelectorAll("nav button").forEach(b=>b.classList.remove("active"));
 if(btn)btn.classList.add("active");

 detail.style.display="none";
 document.getElementById("search").style.display="none";
 document.getElementById("pagination").style.display="none";

 results=getList("rc2_watch");
 hideLoading();
 grid.style.display="block";

 if(!results.length){
  grid.innerHTML="";
  showLoading("Your list is empty.");
  return;
 }

 renderMovies();
}

function showRecent(){
 stopVideo();

 detail.style.display="none";
 document.getElementById("search").style.display="none";
 document.getElementById("pagination").style.display="none";

 results=getList("rc2_recent");
 hideLoading();
 grid.style.display="block";

 if(!results.length){
  grid.innerHTML="";
  showLoading("No recently watched movies.");
  return;
 }

 renderMovies();
}

document.addEventListener("keydown",e=>{
 if(e.key==="Escape"||e.key==="Backspace"){
  if(detail.style.display==="block")goBack();
 }
});

loadMovies();
</script></body>
          </html>
