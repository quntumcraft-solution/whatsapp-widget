<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>RUTIK CINEMA</title><style>
*{box-sizing:border-box}
body{margin:0;background:#090909;color:white;font-family:Arial,sans-serif;font-size:12px}
header{background:#151515;padding:10px;border-bottom:2px solid #e50914}
.logo{font-size:20px;font-weight:bold;color:#e50914}
.sub{font-size:9px;color:#aaa;margin-top:3px}
nav{display:flex;gap:4px;padding:7px;background:#111}
button{background:#292929;color:white;border:0;border-radius:4px;padding:8px;font-size:11px}
button:focus,input:focus,.card:focus{outline:2px solid #e50914;background:#401014}
.active{background:#e50914}
main{padding:8px}
input{width:100%;padding:10px;background:#171717;border:1px solid #444;color:white;border-radius:4px;margin-bottom:7px}
#grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
.card{background:#181818;border:1px solid #333;border-radius:5px;overflow:hidden;min-width:0}
.poster{height:90px;background:linear-gradient(135deg,#333,#111);display:flex;align-items:center;justify-content:center;text-align:center;padding:5px;font-weight:bold;color:#ddd}
.poster img{width:100%;height:100%;object-fit:cover}
.info{padding:6px}
.title{font-weight:bold;font-size:12px}
.meta{color:#aaa;font-size:10px;margin-top:4px}
#detail{display:none;background:#151515;padding:9px;border-radius:5px}
#detail h2{font-size:17px}
#description{color:#ccc;line-height:17px}
#playerBox{display:none;background:#000;margin-top:8px}
video{width:100%;max-height:220px;background:#000}
.row{display:flex;gap:5px;margin:7px 0;flex-wrap:wrap}
.row button{flex:1}
.small{font-size:10px;color:#aaa;line-height:16px}
#status{color:#ffb4b4;font-size:10px;margin:7px 0}
#loading{text-align:center;padding:15px;color:#aaa}
footer{text-align:center;padding:15px;color:#666;font-size:9px}
</style></head><body><header>
 <div class="logo">RUTIK CINEMA</div>
 <div class="sub">MOVIES • DISCOVERY • WATCH</div>
</header><nav>
 <button class="active" onclick="loadTrending(this)">HOME</button>
 <button onclick="loadTrending(this)">TRENDING</button>
 <button onclick="showWatchlist(this)">MY LIST</button>
</nav><main><input id="search" placeholder="Search movies..." onkeydown="if(event.key==='Enter')searchMovies()"><div class="row">
 <button onclick="searchMovies()">SEARCH</button>
 <button onclick="showRecent()">RECENT</button>
</div><div id="loading">Loading movies...</div>
<div id="grid"></div><section id="detail">
 <button onclick="goBack()">← BACK</button>
 <h2 id="dtitle"></h2>
 <div class="small" id="dmeta"></div>
 <p id="description"></p>
 <div class="small" id="license"></div> <div class="row">
  <button onclick="playMovie()">▶ PLAY MOVIE</button>
  <button onclick="toggleWatchlist()">+ MY LIST</button>
 </div> <div id="status"></div> <div id="playerBox">
  <video id="video" controls playsinline preload="metadata"></video>
  <div class="row">
   <button onclick="togglePlay()">PLAY / PAUSE</button>
   <button onclick="stopVideo()">STOP</button>
  </div>
 </div> <div class="small" id="fileInfo"></div>
</section></main><footer>RUTIK CINEMA • CLOUD PHONE EDITION</footer><script>
const API="https://archive.org";

let movies=[];
let current=null;
let currentFile=null;
let lastPage="home";

const grid=document.getElementById("grid");
const loading=document.getElementById("loading");
const detail=document.getElementById("detail");
const video=document.getElementById("video");

function showLoading(msg){
 loading.style.display="block";
 loading.textContent=msg;
}

function hideLoading(){
 loading.style.display="none";
}

function escapeQuery(s){
 return s.replace(/[+\-&|!(){}[\]^"~*?:\\/]/g," ").trim();
}

async function loadTrending(btn){
 stopVideo();

 if(btn){
  document.querySelectorAll("nav button").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
 }

 lastPage="home";
 document.getElementById("search").value="";
 document.getElementById("search").style.display="block";
 detail.style.display="none";

 await searchArchive("mediatype:movies AND collection:feature_films");
}

async function searchMovies(){
 const q=document.getElementById("search").value.trim();

 if(!q){
  alert("Enter movie name");
  return;
 }

 lastPage="search";
 await searchArchive('mediatype:movies AND title:('+escapeQuery(q)+')');
}

async function searchArchive(query){
 showLoading("Searching movies...");
 grid.innerHTML="";
 detail.style.display="none";
 grid.style.display="grid";

 try{
  const url=API+"/advancedsearch.php?q="+encodeURIComponent(query)+
  "&fl[]=identifier&fl[]=title&fl[]=year&fl[]=description&fl[]=creator&fl[]=licenseurl&rows=30&page=1&output=json";

  const r=await fetch(url);

  if(!r.ok)throw Error("Search service unavailable");

  const data=await r.json();
  movies=data.response.docs||[];

  hideLoading();

  if(!movies.length){
   showLoading("No movies found. Try another search.");
   return;
  }

  renderMovies(movies);

 }catch(e){
  showLoading("Internet connection or Archive search error.");
 }
}

function renderMovies(list){
 grid.innerHTML="";

 list.forEach(m=>{
  const card=document.createElement("div");
  card.className="card";
  card.tabIndex=0;

  const poster=document.createElement("div");
  poster.className="poster";
  poster.textContent=m.title||m.identifier;

  const info=document.createElement("div");
  info.className="info";

  const title=document.createElement("div");
  title.className="title";
  title.textContent=m.title||m.identifier;

  const meta=document.createElement("div");
  meta.className="meta";
  meta.textContent=(m.year||"Year unknown")+" • Internet Archive";

  info.append(title,meta);
  card.append(poster,info);

  card.onclick=()=>openMovie(m);
  card.onkeydown=e=>{
   if(e.key==="Enter")openMovie(m);
  };

  grid.appendChild(card);

  const thumb=API+"/services/img/"+encodeURIComponent(m.identifier);
  const img=new Image();
  img.src=thumb;

  img.onload=()=>{
   poster.textContent="";
   poster.appendChild(img);
  };
 });
}

async function openMovie(m){
 current=m;
 currentFile=null;

 stopVideo();

 grid.style.display="none";
 document.getElementById("search").style.display="none";
 detail.style.display="block";

 document.getElementById("dtitle").textContent=m.title||m.identifier;

 document.getElementById("dmeta").textContent=
  (m.year||"Year unknown")+" • "+(m.creator||"Creator unknown");

 document.getElementById("description").textContent=
  m.description||"No description available.";

 document.getElementById("license").textContent=
  "License: "+(m.licenseurl||"Not specified. Check the item's rights information.");

 document.getElementById("status").textContent="Checking available video files...";
 document.getElementById("fileInfo").textContent="";
 document.getElementById("playerBox").style.display="none";

 try{
  const r=await fetch(API+"/metadata/"+encodeURIComponent(m.identifier));

  if(!r.ok)throw Error("Metadata unavailable");

  const data=await r.json();
  const files=data.files||[];

  const mp4=files.filter(f=>
   f.name &&
   f.name.toLowerCase().endsWith(".mp4") &&
   !f.name.toLowerCase().includes("sample") &&
   !f.name.toLowerCase().includes("thumb") &&
   Number(f.size||0)>1000000
  );

  mp4.sort((a,b)=>Number(b.size||0)-Number(a.size||0));

  if(!mp4.length){
   document.getElementById("status").textContent=
    "No suitable MP4 file found for this item.";
   return;
  }

  currentFile=mp4[0];

  document.getElementById("status").textContent=
   "Video file found. Press PLAY MOVIE.";

  document.getElementById("fileInfo").textContent=
   "File: "+currentFile.name+" • Size: "+formatSize(currentFile.size);

 }catch(e){
  document.getElementById("status").textContent=
   "Could not read video file information. Try another movie.";
 }
}

function formatSize(n){
 n=Number(n||0);

 if(n>1073741824)return (n/1073741824).toFixed(2)+" GB";

 return (n/1048576).toFixed(1)+" MB";
}

/* UPDATED PLAYBACK FUNCTION */

function playMovie(){

 if(!currentFile||!current){
  document.getElementById("status").textContent=
   "No playable video file found.";
  return;
 }

 const rights=current.licenseurl||"Not specified";

 const confirmPlay=confirm(
  "VIDEO RIGHTS NOTICE\n\n"+
  "Movie: "+current.title+"\n\n"+
  "License: "+rights+"\n\n"+
  "Please check the item's rights information and confirm that you are permitted to watch this video.\n\n"+
  "Continue?"
 );

 if(!confirmPlay)return;

 const url=API+"/download/"+
  encodeURIComponent(current.identifier)+"/"+
  currentFile.name.split("/").map(encodeURIComponent).join("/");

 video.pause();
 video.removeAttribute("src");
 video.load();

 video.src=url;
 video.load();

 document.getElementById("playerBox").style.display="block";
 document.getElementById("status").textContent="Loading video...";

 video.play().then(()=>{
  document.getElementById("status").textContent="Movie Playing!";
  saveRecent(current);
 }).catch(()=>{
  document.getElementById("status").textContent=
   "Playback failed. Check video format, browser support or server access.";
 });

 video.onerror=function(){
  document.getElementById("status").textContent=
   "Video could not be loaded. Try another available file.";
 };
}

function togglePlay(){
 if(video.paused){
  video.play().catch(()=>{});
 }else{
  video.pause();
 }
}

function stopVideo(){
 video.pause();
 video.removeAttribute("src");
 video.load();
 document.getElementById("playerBox").style.display="none";
}

function goBack(){
 stopVideo();
 detail.style.display="none";
 grid.style.display="grid";
 document.getElementById("search").style.display="block";
}

function getList(key){
 try{
  return JSON.parse(localStorage.getItem(key)||"[]");
 }catch(e){
  return [];
 }
}

function toggleWatchlist(){
 if(!current)return;

 let list=getList("rc_watchlist");

 const i=list.findIndex(x=>x.identifier===current.identifier);

 if(i>=0){
  list.splice(i,1);
 }else{
  list.push(current);
 }

 localStorage.setItem("rc_watchlist",JSON.stringify(list));

 alert(i>=0?"Removed from My List":"Added to My List");
}

function saveRecent(m){
 let list=getList("rc_recent");

 list=list.filter(x=>x.identifier!==m.identifier);
 list.unshift(m);

 localStorage.setItem("rc_recent",JSON.stringify(list.slice(0,20)));
}

function showWatchlist(btn){
 stopVideo();

 document.querySelectorAll("nav button").forEach(b=>b.classList.remove("active"));

 if(btn)btn.classList.add("active");

 detail.style.display="none";
 grid.style.display="grid";
 document.getElementById("search").style.display="none";

 const list=getList("rc_watchlist");

 hideLoading();
 grid.innerHTML="";

 if(!list.length){
  showLoading("Your watchlist is empty.");
  return;
 }

 renderMovies(list);
}

function showRecent(){
 stopVideo();

 detail.style.display="none";
 grid.style.display="grid";
 document.getElementById("search").style.display="none";

 const list=getList("rc_recent");

 hideLoading();
 grid.innerHTML="";

 if(!list.length){
  showLoading("No recently watched movies.");
  return;
 }

 renderMovies(list);
}

document.addEventListener("keydown",e=>{
 if(e.key==="Escape"||e.key==="Backspace"){
  if(detail.style.display==="block"){
   goBack();
  }
 }
});

loadTrending();
</script></body>
</html>
