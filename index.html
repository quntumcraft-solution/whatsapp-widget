<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Cloud Phone Web Hub V4.2</title>

<style>
*{box-sizing:border-box}
html,body{
margin:0;width:100%;height:100%;overflow:hidden;
font-family:Arial,sans-serif;
background:#07111f;color:#f5f8ff
}
button,input{font:inherit}

#app{
height:100%;
display:flex;
flex-direction:column;
max-width:520px;
margin:auto;
background:#07111f
}

header{
height:34px;
flex:0 0 34px;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 7px;
background:#0b1d33;
border-bottom:1px solid #24547e;
font-size:13px;
font-weight:bold
}

#brand{
display:flex;
align-items:center;
gap:6px
}

#brandIcon{
width:22px;
height:22px;
border-radius:6px;
background:#0b8cff;
display:flex;
align-items:center;
justify-content:center
}

#screen{
flex:1;
overflow:auto;
padding:5px
}

.hero{
padding:8px;
border:1px solid #174b76;
border-radius:8px;
background:#0b1c30;
margin-bottom:5px
}

.heroTitle{
font-size:17px;
font-weight:bold
}

.sub{
font-size:9px;
opacity:.75;
margin-top:2px
}

.grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:4px;
margin-bottom:5px
}

.tile{
min-height:43px;
border:1px solid #214866;
border-radius:7px;
background:#0d233b;
color:#fff;
padding:5px;
text-align:left
}

.tile b{
display:block;
font-size:10px
}

.tile small{
font-size:8px;
opacity:.7
}

.row{
display:flex;
align-items:center;
gap:5px;
min-height:31px;
padding:4px 5px;
border-bottom:1px solid #17344f;
border-radius:4px
}

.row.sel{
background:#145b93;
border:1px solid #2b9cff
}

.icon{
width:22px;
height:22px;
object-fit:contain;
flex:0 0 22px;
background:#fff;
border-radius:4px
}

.fallback{
width:22px;
height:22px;
display:flex;
align-items:center;
justify-content:center;
background:#244563;
color:#fff;
font-weight:bold;
border-radius:4px;
flex:0 0 22px;
font-size:11px
}

.num{
width:22px;
flex:0 0 22px;
font-size:9px;
opacity:.8
}

.name{
overflow:hidden;
text-overflow:ellipsis;
white-space:nowrap;
font-size:11px
}

.meta{
margin-left:auto;
font-size:8px;
opacity:.7
}

.section{
font-size:9px;
font-weight:bold;
color:#8fcaff;
padding:5px 2px 3px
}

input{
width:100%;
height:31px;
border:1px solid #28608d;
border-radius:6px;
background:#091a2c;
color:#fff;
padding:5px 7px;
font-size:12px;
outline:none
}

#fitbar{
height:27px;
display:flex;
gap:3px;
padding:3px 5px;
background:#09182a;
border-bottom:1px solid #173b59
}

#fitbar button{
flex:1;
border:1px solid #275579;
border-radius:4px;
background:#102a44;
color:#dceeff;
font-size:9px
}

#fitbar button.sel{
background:#1468a6
}

footer{
height:29px;
flex:0 0 29px;
border-top:1px solid #21445f;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 6px;
font-size:9px;
color:#b9d7ef
}

.badge{
padding:2px 4px;
border-radius:4px;
background:#153a59
}

.light{
background:#f4f7fb!important;
color:#17212b!important
}

.light #app,
.light #screen{
background:#f4f7fb;
color:#17212b
}

.light header{
background:#e4edf6;
color:#17212b;
border-color:#b6cadc
}

.light .hero,
.light .tile,
.light .row{
background:#fff;
color:#17212b;
border-color:#c7d5e2
}

.light .row.sel{
background:#d5eaff;
border-color:#4d94cf
}

.light input{
background:#fff;
color:#17212b;
border-color:#9bb6cc
}

.light #fitbar{
background:#e7eef5;
border-color:#c2d2df
}

.light #fitbar button{
background:#fff;
color:#17212b;
border-color:#9bb6cc
}

.light footer{
border-color:#c2d2df;
color:#425b70
}

.fontSmall .name{
font-size:10px
}

.fontLarge .name{
font-size:13px
}

.fontLarge .row{
min-height:35px
}
</style>
</head>

<body>

<div id="app">

<header>
<div id="brand">
<span id="brandIcon">🌐</span>
<span id="title">WEB HUB 2</span>
</div>
<span id="clock">--:--</span>
</header>

<div id="fitbar">
<button id="bFit" onclick="setHubZoom(1)">FIT</button>
<button onclick="setHubZoom(.9)">90%</button>
<button onclick="setHubZoom(1)">100%</button>
<button onclick="setHubZoom(1.15)">115%</button>
</div>

<div id="screen"></div>

<footer>
<span id="leftKey">LSK Menu</span>
<span id="rightKey">OK Open · # Back</span>
</footer>

</div>


<script>

/* =====================================================

===================================================== */

const sites=[

/* FOOD */

["Food","Swiggy","https://www.swiggy.com/","swiggy"],

/* FINANCE */

/* SHOPPING */

["Shopping","AJIO","https://www.ajio.com/","ajio"],
["Shopping","Nykaa","https://www.nykaa.com/","nykaa"],

["Shopping","Snapdeal","https://www.snapdeal.com/","snapdeal"],
["Shopping","IndiaMART","https://www.indiamart.com/","indiamart"],
["Shopping","OLX","https://www.olx.in/","olx"],
["Shopping","CarDekho","https://www.cardekho.com/",""],
["Shopping","BikeDekho","https://www.bikedekho.com/",""],
["Shopping","Pepperfry","https://www.pepperfry.com/","pepperfry"],
["Shopping","FirstCry","https://www.firstcry.com/","firstcry"],

/* ENTERTAINMENT */

["Entertainment","Netflix","https://www.netflix.com/","netflix"],
["Entertainment","JioHotstar","https://www.hotstar.com/",""],
["Entertainment","Sony LIV","https://www.sonyliv.com/","sonyliv"],
["Entertainment","ZEE5","https://www.zee5.com/","zee5"],
["Entertainment","JioSaavn","https://www.jiosaavn.com/","jiosaavn"],
["Entertainment","Gaana","https://gaana.com/","gaana"],
["Entertainment","BookMyShow","https://in.bookmyshow.com/",""],
["Entertainment","MX Player","https://www.mxplayer.in/",""],
["Entertainment","Aha","https://www.aha.video/",""],
["Entertainment","Hungama","https://www.hungama.com/","hungama"],

/* USEFUL */

["Useful","Justdial","https://www.justdial.com/",""],
["Useful","Practo","https://www.practo.com/","practo"],
["Useful","Goodreturns","https://www.goodreturns.in/",""],
["Useful","Screener","https://www.screener.in/",""],
["Useful","Prokerala","https://www.prokerala.com/",""],
["Useful","APKMirror","https://www.apkmirror.com/","apkmirror"],
["Useful","Speedtest","https://www.speedtest.net/","speedtest"],
["Useful","VirusTotal","https://www.virustotal.com/","virustotal"],
["Useful","Canva","https://www.canva.com/","canva"],
["Useful","Smallpdf","https://smallpdf.com/","smallpdf"]

];


/* =====================================================
   CATEGORIES
===================================================== */

const cats=[
"All",
"Favorites",
"Government",
"Jobs",
"Education",
"Exams",
"Travel",
"Food",
"Finance",
"Shopping",
"Entertainment",
"Useful"
];

const catIcons=[
"▦","★","🇮🇳","💼","📚","🎓",
"✈","🍔","₹","🛒","▶","⚙"
];


/* =====================================================
   STATE
===================================================== */

let mode="home";
let cat=0;
let index=0;
let query="";

let fav=
JSON.parse(
localStorage.getItem("cloudHub2Fav")||"[]"
);

let recent=
JSON.parse(
localStorage.getItem("cloudHub2Recent")||"[]"
);

let theme=
localStorage.getItem("cloudHub2Theme")||"dark";

let font=
localStorage.getItem("cloudHub2Font")||"normal";

let zoom=
parseFloat(
localStorage.getItem("cloudHub2Zoom")||"1"
);


/* =====================================================
   ICON
===================================================== */

function ico(slug,name){

if(!slug){

return '<span class="fallback">'+
esc(name[0]||"?")+
'</span>';

}

return '<img class="icon" src="https://cdn.simpleicons.org/>'+
encodeURIComponent(slug)+
'" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'">'+
'<span class="fallback" style="display:none">'+
esc(name[0]||"?")+
'</span>';

}


/* =====================================================
   ESCAPE
===================================================== */

function esc(s){

return String(s).replace(
/[&<>"']/g,
c=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"
}[c])
);

}


/* =====================================================
   FILTER
===================================================== */

function list(){

let a=sites;

if(cat===1){

a=sites.filter(
(_,i)=>fav.includes(i)
);

}

else if(cat>1){

a=sites.filter(
s=>s[0]===cats[cat]
);

}

if(query){

a=a.filter(
s=>
(s[1]+" "+s[0])
.toLowerCase()
.includes(
query.toLowerCase()
)
);

}

return a;

}


/* =====================================================
   RENDER
===================================================== */

function render(){

const sc=
document.getElementById("screen");

document.body.className=
(theme==="light"?"light ":"")+
(
font==="small"
?"fontSmall":
font==="large"
?"fontLarge":
""
);

document.getElementById("clock")
.textContent=
new Date()
.toLocaleTimeString(
[],
{
hour:"2-digit",
minute:"2-digit"
}
);


/* HOME */

if(mode==="home"){

document.getElementById("title")
.textContent="WEB HUB 2";

sc.innerHTML=

'<div class="hero">'+
'<div class="heroTitle">🌐 Web Hub 2</div>'+
'<div class="sub">100 Websites • Keypad Optimized • Cloud Phone</div>'+
'</div>'+

'<div class="grid">'+

'<button class="tile" onclick="goSearch()">'+
'<b>🔎 Search</b>'+
'<small>Find websites</small>'+
'</button>'+

'<button class="tile" onclick="openFav()">'+
'<b>⭐ Favorites</b>'+
'<small>'+fav.length+' saved</small>'+
'</button>'+

'<button class="tile" onclick="openRecent()">'+
'<b>🕘 Recent</b>'+
'<small>'+recent.length+' used</small>'+
'</button>'+

'</div>'+

'<div class="section">CATEGORIES</div>'+

cats.map(
(c,i)=>
'<div class="row '+(i===index?"sel":"")+
'" data-i="'+i+'">'+

'<span class="fallback">'+
catIcons[i]+
'</span>'+

'<span class="num">'+
(i+1)+
'.</span>'+

'<span class="name">'+
esc(c)+
'</span>'+

'<span class="meta">›</span>'+

'</div>'
).join("");

}


/* SEARCH */

else if(mode==="search"){

document.getElementById("title")
.textContent="SEARCH";

sc.innerHTML=

'<input id="q" '+
'placeholder="Type website name..." '+
'value="'+esc(query)+'">'+

'<div class="section">RESULTS</div>'+

(
list().length
?
list().map(
(s,i)=>siteRow(s,i)
).join("")
:
'<div class="hero">No results found.</div>'
);

const q=
document.getElementById("q");

q.focus();

q.setSelectionRange(
q.value.length,
q.value.length
);

}


/* SETTINGS */

else if(mode==="settings"){

document.getElementById("title")
.textContent="SETTINGS";

const items=[

["Theme",
theme==="dark"?"Dark":"Light"],

["Font Size",
font==="normal"
?"Normal"
:font==="large"
?"Large"
:"Small"],

["Hub Zoom",
Math.round(zoom*100)+"%"],

["Clear Favorites",
fav.length+" saved"],

["Clear History",
recent.length+" saved"],

["About",
"Web Hub 2"]

];

sc.innerHTML=
items.map(
(x,i)=>
'<div class="row '+
(i===index?"sel":"")+
'" data-i="'+i+'">'+

'<span class="fallback">'+
["◐","Aa","⛶","★","⌫","ℹ"][i]+
'</span>'+

'<span class="name">'+
x[0]+
'</span>'+

'<span class="meta">'+
x[1]+" ›"+
'</span>'+

'</div>'
).join("");

}


/* LIST */

else{

document.getElementById("title")
.textContent=
mode==="fav"
?"FAVORITES":
mode==="recent"
?"RECENT":
cats[cat];

let a=list();

if(mode==="recent"){

a=
recent
.map(i=>sites[i])
.filter(Boolean);

}

sc.innerHTML=
a.length
?
a.map(
(s,i)=>siteRow(s,i)
).join("")
:
'<div class="hero">No websites here.</div>';

}

}


/* =====================================================
   ROW
===================================================== */

function siteRow(s,i){

return '<div class="row '+
(i===index?"sel":"")+
'" data-i="'+i+'">'+

ico(s[3],s[1])+

'<span class="num">'+
(i+1)+
'.</span>'+

'<span class="name">'+
esc(s[1])+
'</span>'+

'<span class="meta">'+
(
fav.includes(
sites.indexOf(s)
)
?"★":""
)+
'</span>'+

'</div>';

}


/* =====================================================
   OPEN WEBSITE
===================================================== */

function openSite(s){

if(!s)return;

const si=
sites.indexOf(s);

if(si>=0){

recent=[
si,
...recent.filter(
x=>x!==si
)
].slice(0,20);

localStorage.setItem(
"cloudHub2Recent",
JSON.stringify(recent)
);

}

location.href=s[2];

}


/* =====================================================
   NAVIGATION
===================================================== */

function move(n){

let len;

if(mode==="home")
len=cats.length;

else if(mode==="settings")
len=6;

else
len=list().length;

if(!len)return;

index=
(index+n+len)%len;

render();

}


/* =====================================================
   SELECT
===================================================== */

function select(){

if(mode==="home"){

if(index===0){

mode="list";
cat=0;
index=0;

}

else if(index===1){

mode="fav";
cat=1;
index=0;

}

else{

mode="list";
cat=index;
index=0;

}

render();

return;

}


if(mode==="settings"){

settingsAction();

return;

}


let a=
mode==="recent"
?
recent.map(i=>sites[i]).filter(Boolean)
:
list();

if(a[index])
openSite(a[index]);

}


/* =====================================================
   SEARCH
===================================================== */

function goSearch(){

mode="search";
query="";
index=0;

render();

}


/* =====================================================
   FAVORITES
===================================================== */

function openFav(){

mode="fav";
cat=1;
index=0;

render();

}


/* =====================================================
   RECENT
===================================================== */

function openRecent(){

mode="recent";
index=0;

render();

}


/* =====================================================
   BACK
===================================================== */

function back(){

if(mode==="home")
return;

mode="home";
cat=0;
index=0;
query="";

render();

}


/* =====================================================
   FAVORITE TOGGLE
===================================================== */

function favToggle(){

let a=
mode==="recent"
?
recent.map(i=>sites[i]).filter(Boolean)
:
list();

let s=a[index];

if(!s)return;

let id=sites.indexOf(s);

let p=fav.indexOf(id);

if(p<0)
fav.push(id);
else
fav.splice(p,1);

localStorage.setItem(
"cloudHub2Fav",
JSON.stringify(fav)
);

render();

}


/* =====================================================
   SETTINGS
===================================================== */

function settingsAction(){

if(index===0){

theme=
theme==="dark"
?"light"
:"dark";

localStorage.setItem(
"cloudHub2Theme",
theme
);

}

else if(index===1){

font=
font==="normal"
?"large"
:
font==="large"
?"small"
:"normal";

localStorage.setItem(
"cloudHub2Font",
font
);

}

else if(index===2){

zoom=
zoom>=1.15
?
0.9
:
zoom>=1
?
1.15
:
1;

localStorage.setItem(
"cloudHub2Zoom",
String(zoom)
);

}

else
