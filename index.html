<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>WEB HUB</title>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,sans-serif;
    background:#000;
    color:#111;
}

#app{
    width:100%;
    height:100%;
    max-width:520px;
    margin:auto;
    display:flex;
    flex-direction:column;
    background:#fff;
}

/* HEADER */

#header{
    height:38px;
    min-height:38px;
    background:#071a2c;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:17px;
    font-weight:bold;
    letter-spacing:.5px;
}

/* ZOOM */

#zoombar{
    height:32px;
    min-height:32px;
    display:flex;
    gap:4px;
    padding:3px 5px;
    background:#fff;
    border-bottom:1px solid #aaa;
}

.zoom{
    flex:1;
    background:#fff;
    border:1px solid #1795d2;
    color:#087bb2;
    border-radius:3px;
    font-size:11px;
}

.zoom.active{
    background:#e7f6ff;
    border:2px solid #087db6;
}

/* SCREEN */

#screen{
    flex:1;
    overflow-y:auto;
    overflow-x:hidden;
    background:#fff;
}

/* SECTION */

.section{
    height:27px;
    padding:5px 7px 3px;
    font-size:12px;
    font-weight:bold;
    color:#222;
    background:#fff;
}

/* ROW */

.row{
    height:39px;
    min-height:39px;

    display:flex;
    align-items:center;

    padding:0 8px;

    border-bottom:1px solid #d6d6d6;

    background:#fff;
    color:#222;

    font-size:15px;
}

.row.selected{
    background:#050505;
    color:#fff;
}

.number{
    width:35px;
    min-width:35px;
    font-size:15px;
}

.name{
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
}

.arrow{
    margin-left:auto;
    font-size:18px;
}

/* SEARCH */

#search{
    width:calc(100% - 10px);
    height:32px;
    margin:5px;
    padding:3px 7px;
    border:1px solid #888;
    border-radius:2px;
    background:#fff;
    color:#111;
    font-size:14px;
    outline:none;
}

/* FOOTER */

#footer{
    height:42px;
    min-height:42px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 7px;

    border-top:1px solid #aaa;

    background:#fff;

    color:#087db6;

    font-size:12px;
}

.footerLeft{
    width:33%;
    text-align:left;
}

.footerCenter{
    width:34%;
    text-align:center;
}

.footerRight{
    width:33%;
    text-align:right;
}

/* SMALL DISPLAY */

@media(max-height:180px){

    #header{
        height:29px;
        min-height:29px;
        font-size:14px;
    }

    #zoombar{
        height:27px;
        min-height:27px;
    }

    .zoom{
        font-size:9px;
    }

    .section{
        height:23px;
        padding:4px 5px 2px;
        font-size:10px;
    }

    .row{
        height:30px;
        min-height:30px;
        font-size:12px;
        padding:0 5px;
    }

    .number{
        width:28px;
        min-width:28px;
        font-size:12px;
    }

    #footer{
        height:31px;
        min-height:31px;
        font-size:9px;
    }
}

/* VERY SMALL WIDTH */

@media(max-width:150px){

    #header{
        font-size:13px;
    }

    .zoom{
        font-size:8px;
    }

    .row{
        font-size:11px;
    }

    .number{
        width:24px;
        min-width:24px;
    }

    #footer{
        font-size:8px;
    }
}
</style>
</head>

<body>

<div id="app">

    <div id="header">
        WEB HUB
    </div>

    <div id="zoombar">

        <button class="zoom active"
                onclick="setZoom(1,this)">
            FIT
        </button>

        <button class="zoom"
                onclick="setZoom(1,this)">
            100%
        </button>

        <button class="zoom"
                onclick="setZoom(1.25,this)">
            125%
        </button>

    </div>

    <div id="screen"></div>

    <div id="footer">

        <div class="footerLeft">
            LSK<br>Menu
        </div>

        <div class="footerCenter">
            OK Open
        </div>

        <div class="footerRight">
            RSK<br>Back
        </div>

    </div>

</div>

["Useful","Justdial","https://www.justdial.com/"],
["Useful","Practo","https://www.practo.com/"],
["Useful","Goodreturns","https://www.goodreturns.in/"],
["Useful","Screener","https://www.screener.in/"],
["Useful","Prokerala","https://www.prokerala.com/"],
["Useful","APKMirror","https://www.apkmirror.com/"],
["Useful","Speedtest","https://www.speedtest.net/"],
["Useful","VirusTotal","https://www.virustotal.com/"],
["Useful","Canva","https://www.canva.com/"],
["Useful","Smallpdf","https://smallpdf.com/"]

];


/* =====================================================
   CATEGORIES
===================================================== */

var categories=[
    "All",
    "Favorites",
    "Government",
    "Jobs",
    "Education",
    "Exams",
    "Travel",
    "Food",
    "Finance",
    "Shopping",
    "Entertainment",
    "Useful"
];


/* =====================================================
   VARIABLES
===================================================== */

var mode="categories";

var selected=0;

var currentCategory="All";

var favorites=[];

var recent=[];


/* =====================================================
   LOAD STORAGE
===================================================== */

try{
    favorites=
    JSON.parse(
        localStorage.getItem("wh_fav")||"[]"
    );
}catch(e){
    favorites=[];
}

try{
    recent=
    JSON.parse(
        localStorage.getItem("wh_recent")||"[]"
    );
}catch(e){
    recent=[];
}


/* =====================================================
   RENDER CATEGORIES
===================================================== */

function renderCategories(){

    mode="categories";

    var html="";

    html+=
    '<div class="section">CATEGORIES</div>';

    var i;

    for(i=0;i<categories.length;i++){

        html+=
        '<div class="row '+
        (i===selected?"selected":"")+
        '" data-i="'+i+'">'+

            '<span class="number">'+
            (i+1)+'.'+
            '</span>'+

            '<span class="name">'+
            categories[i]+
            (i===1 && favorites.length
            ?' ('+favorites.length+')'
            :'')+
            '</span>'+

            '<span class="arrow">›</span>'+

        '</div>';

    }

    document.getElementById(
        "screen"
    ).innerHTML=html;

    scrollSelected();

}


/* =====================================================
   GET LIST
===================================================== */

function getList(){

    var arr=[];

    var i;

    for(i=0;i<sites.length;i++){

        if(currentCategory==="All"){

            arr.push(i);

        }
        else if(
            currentCategory==="Favorites"
        ){

            if(
                favorites.indexOf(i)!==-1
            ){
                arr.push(i);
            }

        }
        else{

            if(
                sites[i][0]===
                currentCategory
            ){
                arr.push(i);
            }

        }

    }

    return arr;

}


/* =====================================================
   RENDER SITES
===================================================== */

function renderSites(){

    mode="sites";

    var list=getList();

    var html="";

    html+=
    '<div class="section">'+
    currentCategory.toUpperCase()+
    '</div>';


    if(list.length===0){

        html+=
        '<div class="row selected">'+
        '<span class="name">'+
        'No websites found'+
        '</span>'+
        '</div>';

    }


    var i;

    for(i=0;i<list.length;i++){

        var id=list[i];

        var star=
        favorites.indexOf(id)!==-1
        ?" ★"
        :"";

        html+=
        '<div class="row '+
        (i===selected?"selected":"")+
        '" data-i="'+i+'">'+

            '<span class="number">'+
            (i+1)+'.'+
            '</span>'+

            '<span class="name">'+
            sites[id][1]+
            star+
            '</span>'+

        '</div>';

    }


    document.getElementById(
        "screen"
    ).innerHTML=html;

    scrollSelected();

}


/* =====================================================
   OPEN SITE
===================================================== */

function openSite(){

    var list=getList();

    if(!list[selected]){
        return;
    }

    var id=list[selected];


    /* recent */

    var newRecent=[];

    newRecent.push(id);

    var i;

    for(i=0;i<recent.length;i++){

        if(
            recent[i]!==id &&
            newRecent.length<20
        ){
            newRecent.push(
                recent[i]
            );
        }

    }

    recent=newRecent;

    try{
        localStorage.setItem(
            "wh_recent",
            JSON.stringify(recent)
        );
    }catch(e){}


    window.location.href=
    sites[id][2];

}


/* =====================================================
   FAVORITE
===================================================== */

function toggleFavorite(){

    var list=getList();

    if(!list[selected]){
        return;
    }

    var id=list[selected];

    var p=
    favorites.indexOf(id);

    if(p===-1){

        favorites.push(id);

    }else{

        favorites.splice(p,1);

    }

    try{
        localStorage.setItem(
            "wh_fav",
            JSON.stringify(favorites)
        );
    }catch(e){}


    if(currentCategory==="Favorites"){

        selected=0;

    }

    renderCurrent();

}


/* =====================================================
   CURRENT RENDER
===================================================== */

function renderCurrent(){

    if(mode==="categories"){

        renderCategories();

    }else{

        renderSites();

    }

}


/* =====================================================
   SELECT
===================================================== */

function select(){

    if(mode==="categories"){

        if(selected===0){

            currentCategory="All";
            selected=0;
            renderSites();

            return;

        }


        if(selected===1){

            currentCategory="Favorites";
            selected=0;
            renderSites();

            return;

        }


        if(categories[selected]){

            currentCategory=
            categories[selected];

            selected=0;

            renderSites();

        }

    }
    else{

        openSite();

    }

}


/* =====================================================
   BACK
===================================================== */

function back(){

    if(mode==="sites"){

        selected=0;

        renderCategories();

    }

}


/* =====================================================
   MOVE
===================================================== */

function move(n){

    var max;

    if(mode==="categories"){

        max=categories.length;

    }else{

        max=getList().length;

    }

    if(max<=0){
        return;
    }


    selected+=n;


    if(selected<0){

        selected=max-1;

    }


    if(selected>=max){

        selected=0;

    }


    renderCurrent();

}


/* =====================================================
   SCROLL
===================================================== */

function scrollSelected(){

    var rows=
    document.querySelectorAll(
        "#screen .row"
    );

    if(
        rows[selected]
    ){

        rows[selected].scrollIntoView({
            block:"nearest"
        });

    }

}


/* =====================================================
   ZOOM
===================================================== */

function setZoom(value,button){

    var screen=
    document.getElementById(
        "screen"
    );

    screen.style.zoom=value;


    var buttons=
    document.querySelectorAll(
        ".zoom"
    );

    var i;

    for(i=0;i<buttons.length;i++){

        buttons[i].className=
        "zoom";

    }

    button.className=
    "zoom active";

}


/* =====================================================
   KEYPAD
===================================================== */

document.addEventListener(
"keydown",
function(e){

    var key=e.key;


    /* UP */

    if(
        key==="ArrowUp" ||
        key==="2"
    ){

        e.preventDefault();

        move(-1);

        return;

    }


    /* DOWN */

    if(
        key==="ArrowDown" ||
        key==="8"
    ){

        e.preventDefault();

        move(1);

        return;

    }


    /* OPEN */

    if(
        key==="Enter" ||
        key==="5" ||
        key==="ArrowRight" ||
        key==="6"
    ){

        e.preventDefault();

        select();

        return;

    }


    /* BACK */

    if(
        key==="Escape" ||
        key==="#" ||
        key==="ArrowLeft" ||
        key==="4"
    ){

        e.preventDefault();

        back();

        return;

    }


    /* FAVORITE */

    if(key==="*"){

        e.preventDefault();

        if(mode==="sites"){

            toggleFavorite();

        }

        return;

    }

});


/* =====================================================
   MOUSE / SCREEN CLICK
===================================================== */

document.getElementById(
    "screen"
).addEventListener(
    "click",
    function(e){

        var row=
        e.target.closest(".row");

        if(!row){
            return;
        }

        selected=
        parseInt(
            row.getAttribute(
                "data-i"
            ),
            10
        );

        select();

    }
);


/* =====================================================
   START
===================================================== */

renderCategories();

</script>
