var CATS=['Social','Video','Music','Shopping','Travel','Productivity','AI','News','Finance','Games'];
var APPS=[];
var state={cat:'ALL',q:'',installed:[],hidden:[],deleted:[]};
function $(id){return document.getElementById(id)}
function has(a,x){var i;for(i=0;i<a.length;i++)if(a[i]===x)return true;return false}
function add(a,x){if(!has(a,x))a.push(x)}
function rem(a,x){var i;for(i=a.length-1;i>=0;i--)if(a[i]===x)a.splice(i,1)}
function domain(u){var s=u.replace(/^https?:\/\//i,'').replace(/^www\./i,'');return s.split('/')[0]}
function name(u){var d=domain(u),p=d.split('.'),n=p.length>1?p[p.length-2]:p[0];return n.charAt(0).toUpperCase()+n.substring(1)}
function safe(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function initData(){var i,j,c,u;APPS=[];for(i=0;i<CATS.length;i++){c=CATS[i];for(j=0;j<DATA[c].length;j++){u=DATA[c][j];APPS.push({id:c+'_'+j,cat:c,url:u,name:name(u),domain:domain(u)})}}}
function load(){try{var x=localStorage.getItem('cloudstore_it9020');if(x){x=JSON.parse(x);if(x.installed)state.installed=x.installed;if(x.hidden)state.hidden=x.hidden;if(x.deleted)state.deleted=x.deleted}}catch(e){}}
function save(){try{localStorage.setItem('cloudstore_it9020',JSON.stringify(state))}catch(e){}}
function find(id){var i;for(i=0;i<APPS.length;i++)if(APPS[i].id===id)return APPS[i];return null}
function fav(u){return 'https://www.google.com/s2/favicons?domain='+domain(u)+'&sz=64'}
function drawCats(){var h='<button class="cat '+(state.cat==='ALL'?'on':'')+'" onclick="cat(\'ALL\')">ALL</button>',i;for(i=0;i<CATS.length;i++)h+='<button class="cat '+(state.cat===CATS[i]?'on':'')+'" onclick="cat(\''+CATS[i]+'\')">'+CATS[i].toUpperCase()+'</button>';$("cats").innerHTML=h}
function visible(a){if(has(state.deleted,a.id)||has(state.hidden,a.id))return false;if(state.cat!=='ALL'&&a.cat!==state.cat)return false;if(state.q&&a.name.toLowerCase().indexOf(state.q)<0&&a.domain.toLowerCase().indexOf(state.q)<0&&a.cat.toLowerCase().indexOf(state.q)<0)return false;return true}
function item(a){var ins=has(state.installed,a.id),h='<div class="item"><img class="logo" src="'+fav(a.url)+'" onerror="this.style.display=\'none\';this.nextSibling.style.display=\'block\';"><div class="letter">'+safe(a.name.charAt(0))+'</div><div class="name">'+safe(a.name)+'</div><div class="domain">'+safe(a.domain)+'</div>';if(ins)h+='<button class="btn black" onclick="openApp(\''+a.id+'\')">OPEN</button><button class="btn" onclick="uninstall(\''+a.id+'\')">REMOVE</button>';else h+='<button class="btn black" onclick="install(\''+a.id+'\')">INSTALL</button><button class="btn" onclick="openApp(\''+a.id+'\')">OPEN</button>';h+='<button class="btn" onclick="hide(\''+a.id+'\')">HIDE</button><div class="clear"></div></div>';return h}
function render(){var h='<div class="info">500 apps catalogue</div>',i,n=0;for(i=0;i<APPS.length;i++)if(visible(APPS[i])){h+=item(APPS[i]);n++}if(!n)h+='<div class="notice"><b>No apps found</b><br>Try another search.</div>';$("content").innerHTML=h}
function cat(c){state.cat=c;drawCats();render()}
function doSearch(){state.q=$("search").value.toLowerCase();render()}
function install(id){add(state.installed,id);save();render()}
function uninstall(id){rem(state.installed,id);save();render()}
function openApp(id){var a=find(id);if(a)window.location.href=(a.url.indexOf('http')===0?a.url:'https://'+a.url)}
function hide(id){add(state.hidden,id);rem(state.installed,id);save();render()}
function myApps(){closeMenu();var h='<div class="info"><b>MY APPS</b></div>',i,n=0;for(i=0;i<APPS.length;i++)if(has(state.installed,APPS[i].id)&&!has(state.deleted,APPS[i].id)){h+=item(APPS[i]);n++}if(!n)h+='<div class="notice">No installed apps.</div>';$("content").innerHTML=h}
function settings(){closeMenu();var h='<div class="info"><b>SETTINGS</b></div><button class="btn black" onclick="resetStore()">RESET ALL</button><div class="notice">Hidden apps stay saved. Deleted apps return after RESET.</div>',i,a,n=0;for(i=0;i<APPS.length;i++){a=APPS[i];if(has(state.hidden,a.id)||has(state.deleted,a.id)){h+='<div class="item"><b>'+safe(a.name)+'</b><br><span class="tiny">'+(has(state.deleted,a.id)?'DELETED':'HIDDEN')+'</span><br><button class="btn" onclick="restore(\''+a.id+'\')">RESTORE</button></div>';n++}}if(!n)h+='<div class="notice">Nothing hidden or deleted.</div>';$("content").innerHTML=h}
function restore(id){rem(state.hidden,id);rem(state.deleted,id);save();settings()}
function resetStore(){state.installed=[];state.hidden=[];state.deleted=[];state.cat='ALL';state.q='';$("search").value='';save();drawCats();render()}
function assistant(){closeMenu();$("content").innerHTML='<div class="notice"><b>AI ASSIST</b><br><br>Use Search to find websites.<br><br>Example: YouTube, WhatsApp, Games, Shopping, AI.</div>'}
function device(){closeMenu();$("content").innerHTML='<div class="notice"><b>DEVICE</b><br><br>Target: itel Super Guru 4G<br>Display: 128 x 160<br>UI: keypad friendly<br>Catalogue: 500 websites<br><br>Website compatibility depends on the phone browser.</div>'}
function home(){closeMenu();state.cat='ALL';state.q='';$("search").value='';drawCats();render()}
function toggleMenu(){var m=$("menu");m.style.display=m.style.display==='block'?'none':'block'}
function closeMenu(){$("menu").style.display='none'}
window.onerror=function(msg,src,line){$("content").innerHTML='<div class="notice"><b>STORE ERROR</b><br>'+safe(msg)+'<br>Line '+line+'</div>';return true};
function start(){load();initData();drawCats();render()}
start();
